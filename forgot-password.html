<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 纪检监察大数据可视化平台</title>

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background:
                repeating-linear-gradient(0deg, rgba(0, 210, 255, 0.015) 0px, transparent 1px, transparent 40px, rgba(0, 210, 255, 0.015) 41px),
                repeating-linear-gradient(90deg, rgba(0, 210, 255, 0.015) 0px, transparent 1px, transparent 40px, rgba(0, 210, 255, 0.015) 41px),
                linear-gradient(135deg, rgba(11, 15, 42, 0.3) 0%, rgba(26, 31, 58, 0.4) 100%),
                url('https://www.xawl.edu.cn/guanzhong9.jpg');
            background-attachment: fixed;
            background-size: 40px 40px, 40px 40px, 100% 100%, cover;
            background-position: 0 0, 0 0, 0 0, center center;
            background-repeat: repeat, repeat, no-repeat, no-repeat;
            color: #00D2FF;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(153, 51, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 210, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, rgba(0, 210, 255, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(2px 2px at 20% 30%, rgba(0, 210, 255, 0.8), transparent),
                radial-gradient(2px 2px at 60% 70%, rgba(153, 51, 255, 0.8), transparent),
                radial-gradient(1px 1px at 50% 50%, rgba(0, 210, 255, 0.6), transparent),
                radial-gradient(1px 1px at 80% 10%, rgba(153, 51, 255, 0.6), transparent),
                radial-gradient(2px 2px at 90% 60%, rgba(0, 210, 255, 0.7), transparent),
                radial-gradient(1px 1px at 30% 80%, rgba(153, 51, 255, 0.5), transparent);
            background-size: 200% 200%;
            background-position: 0% 0%;
            pointer-events: none;
            z-index: 0;
            animation: particleFloat 20s linear infinite;
        }

        @keyframes bgPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        @keyframes particleFloat {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 100% 100%;
            }
        }

        .forgot-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            padding: 60px 50px;
            background: linear-gradient(135deg, rgba(11, 15, 42, 0.95) 0%, rgba(26, 31, 58, 0.92) 100%);
            border: 2px solid rgba(0, 210, 255, 0.5);
            border-radius: 20px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(0, 210, 255, 0.3),
                inset 0 0 40px rgba(0, 210, 255, 0.05);
            backdrop-filter: blur(20px);
        }

        .forgot-container::before,
        .forgot-container::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #00D2FF;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.8);
            animation: cornerPulse 2s ease-in-out infinite;
        }

        .forgot-container::before {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
        }

        .forgot-container::after {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
        }

        @keyframes cornerPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .forgot-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .forgot-logo img {
            height: 60px;
            width: auto;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.6));
            transition: all 0.3s ease;
        }

        .forgot-logo img:hover {
            filter: drop-shadow(0 0 25px rgba(0, 210, 255, 0.9));
            transform: scale(1.05);
        }

        .forgot-title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(90deg, #00D2FF 0%, #9933FF 50%, #00D2FF 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            letter-spacing: 2px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.5));
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% center;
            }

            50% {
                background-position: 100% center;
            }
        }

        .forgot-subtitle {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .forgot-form {
            position: relative;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #00D2FF;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 210, 255, 0.05);
            border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #00D2FF;
            background: rgba(0, 210, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00D2FF 0%, #9933FF 100%);
            border: none;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            margin-bottom: 20px;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.6);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-to-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-to-login a {
            color: #00D2FF;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-to-login a:hover {
            color: #9933FF;
            text-shadow: 0 0 10px rgba(153, 51, 255, 0.8);
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #FF6B6B;
        }

        .message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #51CF66;
        }

        .message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reset-link-box {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 210, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            display: none;
        }

        .reset-link-box.show {
            display: block;
        }

        .reset-link-box p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            margin-bottom: 10px;
        }

        .reset-link-box a {
            color: #00D2FF;
            word-break: break-all;
            text-decoration: none;
            font-size: 13px;
        }

        .reset-link-box a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .forgot-container {
                padding: 40px 30px;
                max-width: 90%;
            }

            .forgot-title {
                font-size: 22px;
            }

            .forgot-logo img {
                height: 50px;
            }
        }
    </style>
</head>

<body>
    <!-- 忘记密码容器 -->
    <div class="forgot-container">
        <!-- Logo 区域 -->
        <div class="forgot-logo">
            <img src="https://www.xawl.edu.cn/image/logo.png" alt="西安文理学院">
        </div>

        <!-- 标题区域 -->
        <div class="forgot-title">
            忘记密码
        </div>

        <!-- 副标题 -->
        <div class="forgot-subtitle">
            请输入您的用户名，我们将为您生成密码重置链接
        </div>

        <!-- 忘记密码表单 -->
        <form class="forgot-form" id="forgotForm">
            <!-- 用户名输入 -->
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> 用户名
                </label>
                <input type="text" id="username" name="username" class="form-input" placeholder="请输入您的用户名" required
                    autocomplete="username">
            </div>

            <!-- 提交按钮 -->
            <button type="submit" class="submit-button" id="submitButton">
                <i class="fas fa-paper-plane"></i> 获取重置链接
            </button>

            <!-- 返回登录 -->
            <div class="back-to-login">
                <a href="login.html">
                    <i class="fas fa-arrow-left"></i> 返回登录
                </a>
            </div>

            <!-- 消息提示 -->
            <div class="message" id="message"></div>

            <!-- 重置链接显示框 -->
            <div class="reset-link-box" id="resetLinkBox">
                <p><i class="fas fa-info-circle"></i> 密码重置链接已生成：</p>
                <a href="#" id="resetLink" target="_blank"></a>
                <p style="margin-top: 10px; font-size: 12px; color: rgba(255, 255, 255, 0.6);">
                    请复制此链接并在浏览器中打开，或直接点击链接进行密码重置。
                </p>
            </div>
        </form>
    </div>

    <script>
        // 获取 CSRF Token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // 显示消息
        function showMessage(text, type) {
            const messageElement = document.getElementById('message');
            messageElement.textContent = text;
            messageElement.className = `message ${type} show`;

            // 5秒后自动隐藏
            setTimeout(() => {
                messageElement.classList.remove('show');
            }, 5000);
        }

        // 显示重置链接
        function showResetLink(url) {
            const resetLinkBox = document.getElementById('resetLinkBox');
            const resetLink = document.getElementById('resetLink');

            // 构建完整的 URL（如果是相对路径）
            const fullUrl = url.startsWith('http') ? url : window.location.origin + url;

            resetLink.href = fullUrl;
            resetLink.textContent = fullUrl;
            resetLinkBox.classList.add('show');
        }

        // 处理忘记密码表单提交
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const submitButton = document.getElementById('submitButton');
            const resetLinkBox = document.getElementById('resetLinkBox');

            // 验证输入
            if (!username) {
                showMessage('用户名不能为空', 'error');
                return;
            }

            // 隐藏之前的重置链接
            resetLinkBox.classList.remove('show');

            // 禁用提交按钮，防止重复提交
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 处理中...';

            try {
                // 调用忘记密码 API
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: username
                    })
                });

                const data = await response.json();

                if (response.ok && data.code === 0) {
                    // 请求成功
                    showMessage(data.message || '重置链接已生成', 'success');

                    // 如果返回了重置链接，显示它
                    if (data.data && data.data.reset_url) {
                        showResetLink(data.data.reset_url);
                    }

                    submitButton.disabled = false;
                    submitButton.innerHTML = '<i class="fas fa-paper-plane"></i> 获取重置链接';
                } else {
                    // 请求失败
                    showMessage(data.message || '请求失败，请重试', 'error');
                    submitButton.disabled = false;
                    submitButton.innerHTML = '<i class="fas fa-paper-plane"></i> 获取重置链接';
                }
            } catch (error) {
                console.error('忘记密码错误:', error);
                showMessage('网络错误，请检查连接后重试', 'error');
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fas fa-paper-plane"></i> 获取重置链接';
            }
        });
    </script>
</body>

</html>
