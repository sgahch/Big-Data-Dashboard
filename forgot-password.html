<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 汇数明监 · AI监管大数据智能看板</title>

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            letter-spacing: 0.16px;
            background: #f4f4f4;
            color: #161616;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .forgot-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 460px;
            padding: 48px 44px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .forgot-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .forgot-logo img {
            height: 64px;
            width: auto;
        }

        .forgot-title {
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            color: #161616;
            margin-bottom: 12px;
        }

        .forgot-subtitle {
            text-align: center;
            font-size: 14px;
            color: #525252;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .forgot-form {
            position: relative;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #161616;
            font-weight: 400;
        }

        .form-group label i {
            color: #0f62fe;
            margin-right: 4px;
        }

        .form-input {
            width: 100%;
            padding: 11px 16px;
            background: #f4f4f4;
            border: none;
            border-bottom: 1px solid #8c8c8c;
            border-radius: 0;
            color: #161616;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.15s ease;
            outline: none;
        }

        .form-input:focus {
            border-bottom: 2px solid #0f62fe;
            background: #f4f4f4;
        }

        .form-input::placeholder {
            color: #8c8c8c;
        }

        .submit-button {
            width: 100%;
            padding: 13px;
            background: #0f62fe;
            border: none;
            border-radius: 0;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.16px;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-bottom: 20px;
        }

        .submit-button:hover {
            background: #0050e6;
        }

        .submit-button:active {
            background: #002d9c;
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-to-login {
            text-align: center;
            margin-top: 16px;
        }

        .back-to-login a {
            color: #0f62fe;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.15s ease;
        }

        .back-to-login a:hover {
            color: #0043ce;
            text-decoration: underline;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 0;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .message.error {
            background: #fff1f1;
            border-left: 3px solid #da1e28;
            color: #da1e28;
        }

        .message.success {
            background: #defbe6;
            border-left: 3px solid #24a148;
            color: #0e6027;
        }

        .message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reset-link-box {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            display: none;
        }

        .reset-link-box.show {
            display: block;
        }

        .reset-link-box p {
            color: #525252;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .reset-link-box a {
            color: #0f62fe;
            word-break: break-all;
            text-decoration: none;
            font-size: 13px;
        }

        .reset-link-box a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .forgot-container {
                padding: 36px 24px;
                max-width: 92%;
            }

            .forgot-title {
                font-size: 20px;
            }

            .forgot-logo img {
                height: 52px;
            }
        }
    </style>
</head>

<body>
    <!-- 忘记密码容器 -->
    <div class="forgot-container">
        <!-- Logo 区域 -->
        <div class="forgot-logo">
            <img src="/assets/logo-icon.png" alt="汇数明监 · AI监管大数据智能看板">
        </div>

        <!-- 标题区域 -->
        <div class="forgot-title">
            忘记密码
        </div>

        <!-- 副标题 -->
        <div class="forgot-subtitle">
            请输入您的用户名，我们将为您生成密码重置链接
        </div>

        <!-- 忘记密码表单 -->
        <form class="forgot-form" id="forgotForm">
            <!-- 用户名输入 -->
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> 用户名
                </label>
                <input type="text" id="username" name="username" class="form-input" placeholder="请输入您的用户名" required
                    autocomplete="username">
            </div>

            <!-- 提交按钮 -->
            <button type="submit" class="submit-button" id="submitButton">
                <i class="fas fa-paper-plane"></i> 获取重置链接
            </button>

            <!-- 返回登录 -->
            <div class="back-to-login">
                <a href="login.html">
                    <i class="fas fa-arrow-left"></i> 返回登录
                </a>
            </div>

            <!-- 消息提示 -->
            <div class="message" id="message"></div>

            <!-- 重置链接显示框 -->
            <div class="reset-link-box" id="resetLinkBox">
                <p><i class="fas fa-info-circle"></i> 密码重置链接已生成：</p>
                <a href="#" id="resetLink" target="_blank"></a>
                <p style="margin-top: 10px; font-size: 12px; color: #8c8c8c;">
                    请复制此链接并在浏览器中打开，或直接点击链接进行密码重置。
                </p>
            </div>
        </form>
    </div>

    <script>
        // 获取 CSRF Token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // 显示消息
        function showMessage(text, type) {
            const messageElement = document.getElementById('message');
            messageElement.textContent = text;
            messageElement.className = `message ${type} show`;

            // 5秒后自动隐藏
            setTimeout(() => {
                messageElement.classList.remove('show');
            }, 5000);
        }

        // 显示重置链接
        function showResetLink(url) {
            const resetLinkBox = document.getElementById('resetLinkBox');
            const resetLink = document.getElementById('resetLink');

            // 构建完整的 URL（如果是相对路径）
            const fullUrl = url.startsWith('http') ? url : window.location.origin + url;

            resetLink.href = fullUrl;
            resetLink.textContent = fullUrl;
            resetLinkBox.classList.add('show');
        }

        // 处理忘记密码表单提交
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const submitButton = document.getElementById('submitButton');
            const resetLinkBox = document.getElementById('resetLinkBox');

            // 验证输入
            if (!username) {
                showMessage('用户名不能为空', 'error');
                return;
            }

            // 隐藏之前的重置链接
            resetLinkBox.classList.remove('show');

            // 禁用提交按钮，防止重复提交
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 处理中...';

            try {
                // 调用忘记密码 API
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: username
                    })
                });

                const data = await response.json();

                if (response.ok && data.code === 0) {
                    // 请求成功
                    showMessage(data.message || '重置链接已生成', 'success');

                    // 如果返回了重置链接，显示它
                    if (data.data && data.data.reset_url) {
                        showResetLink(data.data.reset_url);
                    }

                    submitButton.disabled = false;
                    submitButton.innerHTML = '<i class="fas fa-paper-plane"></i> 获取重置链接';
                } else {
                    // 请求失败
                    showMessage(data.message || '请求失败，请重试', 'error');
                    submitButton.disabled = false;
                    submitButton.innerHTML = '<i class="fas fa-paper-plane"></i> 获取重置链接';
                }
            } catch (error) {
                console.error('忘记密码错误:', error);
                showMessage('网络错误，请检查连接后重试', 'error');
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fas fa-paper-plane"></i> 获取重置链接';
            }
        });
    </script>
</body>

</html>
