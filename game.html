<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超级马里奥 - HTML5版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
            color: white;
        }

        #game-wrapper {
            position: relative;
            border: 6px solid #fff;
            border-radius: 8px;
            box-shadow:
                0 0 40px rgba(0,0,0,0.8),
                0 0 80px rgba(92, 148, 252, 0.3),
                inset 0 0 20px rgba(0,0,0,0.5);
            background: #000;
        }

        #game-container {
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: linear-gradient(to bottom, #5c94fc 0%, #5c94fc 60%, #c84c0c 60%, #c84c0c 100%);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* UI 界面 */
        #ui-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0.4));
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            z-index: 10;
            text-shadow: 2px 2px 0 #000;
        }

        .ui-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ui-label { color: #fff; }
        .ui-value { color: #fff; }
        #score-value { color: #fff; min-width: 80px; }
        #coin-value { color: #ffd700; min-width: 30px; }
        #world-value { color: #7fff00; }
        #time-value { color: #ff6b6b; min-width: 40px; }

        #life-icon {
            color: #ff3333;
            font-size: 18px;
        }

        /* 菜单覆盖层 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h1 {
            font-size: 32px;
            color: #ff6b6b;
            text-shadow: 4px 4px 0 #000, -2px -2px 0 #fff;
            margin-bottom: 10px;
            animation: bounce 1s infinite;
        }

        .overlay h2 {
            font-size: 18px;
            color: #7fff00;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0 #000;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .btn {
            padding: 15px 40px;
            font-size: 16px;
            font-family: inherit;
            background: linear-gradient(to bottom, #ff6b6b, #c0392b);
            color: white;
            border: 3px solid #fff;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            text-transform: uppercase;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #8b0000, 0 8px 20px rgba(0,0,0,0.5);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #8b0000, 0 10px 25px rgba(0,0,0,0.5);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8b0000, 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn.secondary {
            background: linear-gradient(to bottom, #3498db, #2980b9);
            box-shadow: 0 6px 0 #1a5276, 0 8px 20px rgba(0,0,0,0.5);
        }

        .btn.secondary:hover {
            box-shadow: 0 8px 0 #1a5276, 0 10px 25px rgba(0,0,0,0.5);
        }

        .instructions {
            margin-top: 20px;
            font-size: 10px;
            color: #aaa;
            text-align: center;
            line-height: 1.8;
        }

        .instructions span {
            color: #ffd700;
        }

        /* 移动端控制 */
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            padding: 0 15px;
            z-index: 50;
            justify-content: space-between;
        }

        @media (max-width: 800px) {
            #mobile-controls { display: flex; }
            #game-wrapper { border-width: 3px; }
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 5px;
        }

        .ctrl-btn {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: white;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: rgba(255,255,255,0.4);
        }

        .action-btns {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
        }

        .action-btn.a-btn {
            background: rgba(255, 80, 80, 0.8);
            border: 3px solid rgba(255,255,255,0.6);
        }

        .action-btn.b-btn {
            background: rgba(80, 180, 80, 0.8);
            border: 3px solid rgba(255,255,255,0.6);
        }

        /* 游戏结束画面 */
        #game-over-screen {
            background: rgba(0, 0, 0, 0.95);
        }

        #game-over-screen h1 {
            color: #ff3333;
            font-size: 40px;
        }

        /* 胜利画面 */
        #win-screen h1 {
            color: #ffd700;
            animation: rainbow 2s infinite;
        }

        @keyframes rainbow {
            0% { color: #ff3333; }
            25% { color: #ffd700; }
            50% { color: #7fff00; }
            75% { color: #00bfff; }
            100% { color: #ff3333; }
        }

        /* 暂停菜单 */
        #pause-menu {
            background: rgba(0, 0, 0, 0.85);
        }
    </style>
</head>

<div id="game-wrapper">
    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="480"></canvas>

        <!-- 顶部UI栏 -->
        <div id="ui-bar">
            <div class="ui-item">
                <span class="ui-label">SCORE</span>
                <span class="ui-value" id="score-value">000000</span>
            </div>
            <div class="ui-item">
                <span id="life-icon">❤❤❤</span>
            </div>
            <div class="ui-item">
                <span class="ui-label">WORLD</span>
                <span class="ui-value" id="world-value">1-1</span>
            </div>
            <div class="ui-item">
                <span class="ui-label">COIN</span>
                <span class="ui-value" id="coin-value">×0</span>
            </div>
            <div class="ui-item">
                <span class="ui-label">TIME</span>
                <span class="ui-value" id="time-value">400</span>
            </div>
        </div>

        <!-- 开始菜单 -->
        <div id="start-screen" class="overlay">
            <h1>SUPER MARIO</h1>
            <h2>HTML5 EDITION</h2>
            <button class="btn" onclick="game.startGame()">开始游戏</button>
            <button class="btn secondary" onclick="game.startGame(true)">练习模式</button>
            <div class="instructions">
                <span>← →</span> 或 <span>A D</span> 移动 | <span>↑</span> 或 <span>W</span> 跳跃 | <span>SPACE</span> 加速跑<br>
                <span>ESC</span> 暂停 | <span>ENTER</span> 开始
            </div>
        </div>

        <!-- 暂停菜单 -->
        <div id="pause-menu" class="overlay hidden">
            <h1>PAUSED</h1>
            <button class="btn" onclick="game.resumeGame()">继续游戏</button>
            <button class="btn secondary" onclick="game.backToMenu()">返回菜单</button>
        </div>

        <!-- 游戏结束 -->
        <div id="game-over-screen" class="overlay hidden">
            <h1>GAME OVER</h1>
            <h2 id="final-score">SCORE: 0</h2>
            <button class="btn" onclick="game.startGame()">重新开始</button>
            <button class="btn secondary" onclick="game.backToMenu()">返回菜单</button>
        </div>

        <!-- 胜利画面 -->
        <div id="win-screen" class="overlay hidden">
            <h1>LEVEL CLEAR!</h1>

            <button class="btn secondary" onclick="game.backToMenu()">返回菜单</button>
        </div>

            <div class="dpad">
                <div></div>
                <div class="ctrl-btn" ontouchstart="game.setKey('up', true)" ontouchend="game.setKey('up', false)">▲</div>
                <div></div>
                <div class="ctrl-btn" ontouchstart="game.setKey('left', true)" ontouchend="game.setKey('left', false)">◀</div>
                <div></div>
                <div class="ctrl-btn" ontouchstart="game.setKey('right', true)" ontouchend="game.setKey('right', false)">▶</div>
            </div>
            <div class="action-btns">
                <div class="ctrl-btn action-btn b-btn" ontouchstart="game.setKey('run', true)" ontouchend="game.setKey('run', false)">B</div>
                <div class="ctrl-btn action-btn a-btn" ontouchstart="game.setKey('up', true); game.setKey('jump', true)" ontouchend="game.setKey('up', false); game.setKey('jump', false)">A</div>
            </div>
        </div>
    </div>
</div>

<script>
// ==================== 音频系统 ====================
class AudioManager {
    constructor() {
        this.ctx = null;
        this.initialized = false;
    }

    init() {
        if (this.initialized) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.initialized = true;
        } catch(e) {
            console.log('Audio not supported');
        }
    }

    play(type) {
        if (!this.initialized) this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;

        switch(type) {
            case 'jump':
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
                break;
            case 'coin':
                osc.type = 'square';
                osc.frequency.setValueAtTime(988, now);
                osc.frequency.setValueAtTime(1319, now + 0.08);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
                break;
            case 'stomp':
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
                break;
            case 'break':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
                break;
            case 'powerup':
                osc.type = 'square';
                osc.frequency.setValueAtTime(330, now);
                osc.frequency.setValueAtTime(494, now + 0.1);
                osc.frequency.setValueAtTime(659, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
                break;
            case 'die':
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
                break;
            case 'win':
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.connect(g);
                    g.connect(this.ctx.destination);
                    o.type = 'square';
                    o.frequency.setValueAtTime(freq, now + i * 0.15);
                    g.gain.setValueAtTime(0.1, now + i * 0.15);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.14);
                    o.start(now + i * 0.15);
                    o.stop(now + i * 0.15 + 0.15);
                });
                break;
            case 'flag':
                osc.type = 'square';
                for(let i = 0; i < 8; i++) {
                    const o = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    o.connect(g);
                    g.connect(this.ctx.destination);
                    o.frequency.setValueAtTime(400 + i * 100, now + i * 0.08);
                    g.gain.setValueAtTime(0.08, now + i * 0.08);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.08);
                    o.start(now + i * 0.08);
                    o.stop(now + i * 0.08 + 0.08);
                }
                break;
        }
    }
}

// ==================== 主游戏类 ====================
class MarioGame {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');

        this.audio = new AudioManager();

        // 游戏常量
        this.TILE_SIZE = 32;
        this.GRAVITY = 0.5;
        this.FRICTION = 0.85;
        this.JUMP_FORCE = -12;
        this.RUN_SPEED = 6;
        this.WALK_SPEED = 4;

        // 游戏状态
        this.state = {
            running: false,
            paused: false,
            pausedByEsc: false,
            gameOver: false,
            levelComplete: false,
            practiceMode: false,
            score: 0,
            coins: 0,
            lives: 3,
            time: 400,
            world: 1,
            level: 1,
            cameraX: 0,
            cameraY: 0,
            inPipe: false,
            pipeTarget: null
        };

        // 输入状态
        this.keys = {
            left: false,
            right: false,
            up: false,
            jump: false,
            run: false
        };

        // 按键前一个状态（用于检测按下瞬间）
        this.prevKeys = {
            up: false
        };

        // 游戏对象
        this.player = null;
        this.tiles = [];
        this.enemies = [];
        this.coins = [];
        this.particles = [];
        this.powerups = [];
        this.pipes = [];
        this.decorations = [];
        this.flag = null;

        // 地图数据
        this.levels = this.createLevels();

        // 初始化
        this.init();
    }

    init() {
        this.setupEventListeners();
    }

    setupEventListeners() {
        window.addEventListener('keydown', (e) => this.handleKeyDown(e));
        window.addEventListener('keyup', (e) => this.handleKeyUp(e));
    }

    handleKeyDown(e) {
        if (e.repeat) return;

        switch(e.key) {
            case 'ArrowLeft':
            case 'a':
            case 'A':
                this.keys.left = true;
                break;
            case 'ArrowRight':
            case 'd':
            case 'D':
                this.keys.right = true;
                break;
            case 'ArrowUp':
            case 'w':
            case 'W':
            case ' ':
                this.keys.up = true;
                if (!this.state.running && !this.state.paused && !this.state.gameOver && !this.state.levelComplete) {
                    this.startGame();
                }
                break;
            case 'Shift':
            case 'Control':
                this.keys.run = true;
                break;
            case 'Escape':
                if (this.state.running && !this.state.gameOver && !this.state.levelComplete) {
                    if (this.state.paused) {
                        this.resumeGame();
                    } else {
                        this.pauseGame();
                    }
                }
                break;
            case 'Enter':
                if (!this.state.running && !this.state.paused) {
                    this.startGame();
                }
                break;
        }
    }

    handleKeyUp(e) {
        switch(e.key) {
            case 'ArrowLeft':
            case 'a':
            case 'A':
                this.keys.left = false;
                break;
            case 'ArrowRight':
            case 'd':
            case 'D':
                this.keys.right = false;
                break;
            case 'ArrowUp':
            case 'w':
            case 'W':
            case ' ':
                this.keys.up = false;
                break;
            case 'Shift':
            case 'Control':
                this.keys.run = false;
                break;
        }
    }

    // 移动端控制
    setKey(action, value) {
        if (action === 'left') this.keys.left = value;
        if (action === 'right') this.keys.right = value;
        if (action === 'up') this.keys.up = value;
        if (action === 'run') this.keys.run = value;
        if (action === 'jump' && value && !this.state.running) {
            this.startGame();
        }
    }

    // 创建关卡
    createLevels() {
        return {
            '1-1': this.createLevel1_1(),
            '1-2': this.createLevel1_2(),
            '1-3': this.createLevel1_3(),
            '1-4': this.createLevel1_4()

    }

    // 开始游戏
    startGame(practiceMode = false) {
        this.state.practiceMode = practiceMode;
        this.state.running = true;
        this.state.gameOver = false;
        this.state.levelComplete = false;
        this.state.paused = false;

        if (!practiceMode) {
            this.state.score = 0;
            this.state.coins = 0;
            this.state.lives = 3;
            this.state.world = 1;
            this.state.level = 1;
        }

        this.state.time = 400;

        this.player = {
            x: 100,
            y: 300,
            width: 28,
            height: 32,
            vx: 0,
            vy: 0,
            grounded: false,
            facingRight: true,
            big: false,
            invincible: false,
            invincibleTimer: 0,
            dead: false,
            jumpCount: 0,  // 二段跳计数
            canDoubleJump: true  // 是否可以二段跳
        };

        this.loadLevel(`1-${this.state.level}`);

        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('win-screen').classList.add('hidden');

        this.lastTime = performance.now();
        this.gameLoop();
        this.startTimer();
    }

    loadLevel(levelId) {
        const level = this.levels[levelId];

        this.tiles = [...level.tiles];
        this.enemies = level.enemies.map(e => ({
            ...e,
            width: e.type === 'turtle' ? 30 : 28,
            height: e.type === 'turtle' ? 36 : 26,
            dead: false,
            stunned: false,
            stunnedTimer: 0
        }));
        this.coins = level.coins.map(c => ({ ...c }));
        this.particles = [];
        this.powerups = [];
        this.pipes = level.pipes || [];
        this.decorations = level.decorations || [];
        this.flag = { x: level.flagX, reached: false };

        this.state.cameraX = 0;
        this.state.inPipe = false;
    }

    startTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);

        this.timerInterval = setInterval(() => {
            if (this.state.running && !this.state.paused && !this.state.gameOver && !this.state.levelComplete) {
                this.state.time--;
                if (this.state.time <= 0) {
                    this.playerDie();
                }
            }
        }, 1000);
    }

    pauseGame() {
        this.state.paused = true;
        this.state.pausedByEsc = true;
        document.getElementById('pause-menu').classList.remove('hidden');
    }

    resumeGame() {
        this.state.paused = false;
        document.getElementById('pause-menu').classList.add('hidden');
        this.lastTime = performance.now();
        this.gameLoop();
    }

    backToMenu() {
        this.state.running = false;
        this.state.paused = false;
        this.state.gameOver = false;
        this.state.levelComplete = false;

        if (this.timerInterval) clearInterval(this.timerInterval);

        document.getElementById('pause-menu').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        document.getElementById('win-screen').classList.add('hidden');
        document.getElementById('start-screen').classList.remove('hidden');
    }

    update(dt) {
        if (this.state.paused || this.state.gameOver || this.state.levelComplete) return;

        const p = this.player;
        if (p.dead) return;

        // 玩家移动 - 使用加速度
        const speed = this.keys.run ? 3 : 2;

        if (this.keys.right) {
            p.vx += 0.2;
            p.facingRight = true;
        } else if (this.keys.left) {
            p.vx -= 0.2;
            p.facingRight = false;
        } else {
            p.vx *= this.FRICTION;
        }

        p.vx = Math.max(-speed, Math.min(speed, p.vx));

        // 检测跳跃键刚按下（而不是按住）
        const jumpJustPressed = this.keys.up && !this.prevKeys.up;

        // 跳跃 - 支持二段跳
        if (jumpJustPressed) {
            if (p.grounded) {
                // 第一次跳跃
                p.vy = this.JUMP_FORCE;
                p.grounded = false;
                p.jumpCount = 1;
                p.canDoubleJump = true;
                this.audio.play('jump');
            } else if (p.canDoubleJump && p.jumpCount < 2) {
                // 二段跳
                p.vy = this.JUMP_FORCE * 0.85;  // 二段跳稍低一点
                p.jumpCount = 2;
                p.canDoubleJump = false;
                this.audio.play('jump');
            }
        }

        // 记录当前按键状态
        this.prevKeys.up = this.keys.up;

        // 落地时重置跳跃计数
        if (p.grounded) {
            p.jumpCount = 0;
            p.canDoubleJump = true;
        }

        if (p.invincible) {
            p.invincibleTimer -= dt;
            if (p.invincibleTimer <= 0) {
                p.invincible = false;
            }
        }

        p.vy += this.GRAVITY;
        p.vy = Math.min(p.vy, 15);

        p.x += p.vx;
        this.checkTileCollision(p, 'x');

        p.y += p.vy;
        p.grounded = false;
        this.checkTileCollision(p, 'y');

        if (p.x < 0) p.x = 0;
        if (p.y > 600) {
            this.playerDie();
            return;
        }

        const targetCamX = p.x - this.canvas.width / 3;
        this.state.cameraX = Math.max(0, Math.min(targetCamX, this.tiles.length * 32 - this.canvas.width));

        this.updateEnemies();
        this.updateCoins();
        this.updateParticles();
        this.updatePowerups();
        this.checkFlag();
    }

    checkTileCollision(entity, axis) {
        const p = this.player;
        const eWidth = entity.width || 28;
        const eHeight = entity.height || (p.big ? 64 : 32);

        for (let tile of this.tiles) {
            if (tile.type === 'pole' || tile.type === 'flag' || tile.type === 'pipe-up') continue;

            if (entity.x < tile.x + tile.w &&
                entity.x + eWidth > tile.x &&
                entity.y < tile.y + tile.h &&
                entity.y + eHeight > tile.y) {

                if (axis === 'x') {
                    if (entity.vx > 0) {
                        entity.x = tile.x - eWidth;
                    } else if (entity.vx < 0) {
                        entity.x = tile.x + tile.w;
                    }
                    entity.vx = 0;
                } else {
                    if (entity.vy > 0) {
                        entity.y = tile.y - eHeight;
                        entity.grounded = true;
                        entity.vy = 0;
                    } else if (entity.vy < 0) {
                        entity.y = tile.y + tile.h;
                        entity.vy = 0;

                        if (tile.type === 'brick' || tile.type === 'question') {
                            if (tile.type === 'question' && tile.active) {
                                this.spawnPowerup(tile.x, tile.y - 32);
                                tile.active = false;
                                this.audio.play('powerup');
                            } else if (tile.type === 'brick' && tile.active) {
                                this.createParticles(tile.x + 16, tile.y + 16, '#8b4513', 8);
                                this.audio.play('break');
                                tile.active = false;
                                tile.type = 'broken';
                            }
                        }
                    }
                }
            }
        }
    }

    updateEnemies() {
        const p = this.player;

        for (let enemy of this.enemies) {
            if (enemy.dead) continue;

            if (enemy.stunned) {
                enemy.stunnedTimer -= 16;
                if (enemy.stunnedTimer <= 0) {
                    enemy.stunned = false;
                    enemy.vx = enemy.facingLeft ? -1 : 1;
                }
                continue;
            }

            enemy.x += enemy.vx;
            enemy.vy += this.GRAVITY;
            enemy.y += enemy.vy;

            for (let tile of this.tiles) {
                if (tile.type === 'ground' || tile.type === 'brick') {
                    if (enemy.x < tile.x + tile.w && enemy.x + enemy.width > tile.x &&
                        enemy.y + enemy.height > tile.y && enemy.y < tile.y + tile.h) {
                        enemy.y = tile.y - enemy.height;
                        enemy.vy = 0;

                        if (enemy.vx > 0 && enemy.x + enemy.width >= tile.x + tile.w - 5) {
                            enemy.vx = -1;
                        } else if (enemy.vx < 0 && enemy.x <= tile.x + 5) {
                            enemy.vx = 1;
                        }
                    }
                }
            }

            if (enemy.x < this.state.cameraX - 100 || enemy.x > this.state.cameraX + this.canvas.width + 100) {
                enemy.dead = true;
            }

            if (!p.dead && !p.invincible) {
                const px = p.x, py = p.y;
                const pw = p.width, ph = p.big ? 64 : 32;

                if (p.vy > 0 && px < enemy.x + enemy.width && px + pw > enemy.x &&
                    py + ph > enemy.y && py + ph < enemy.y + enemy.height / 2 + 10) {

                    if (enemy.type === 'goomba') {
                        enemy.dead = true;
                        p.vy = -6;
                        this.state.score += 100;
                        this.audio.play('stomp');
                    } else if (enemy.type === 'turtle') {
                        if (!enemy.shell) {
                            enemy.shell = true;
                            enemy.vx = 0;
                            enemy.height = 20;
                            p.vy = -6;
                            this.state.score += 100;
                            this.audio.play('stomp');
                        } else {
                            const kickDir = p.x < enemy.x ? 1 : -1;
                            enemy.vx = kickDir * 8;
                            enemy.stunned = true;
                            enemy.stunnedTimer = 5000;
                            this.audio.play('stomp');
                        }
                    }
                } else if (px < enemy.x + enemy.width && px + pw > enemy.x &&
                           py < enemy.y + enemy.height && py + ph > enemy.y) {
                    if (p.big) {
                        p.big = false;
                        p.height = 32;
                        p.invincible = true;
                        p.invincibleTimer = 3000;
                        this.audio.play('powerup');
                    } else {
                        this.playerDie();
                    }
                }
            }
        }

        this.enemies = this.enemies.filter(e => !e.dead);
    }

    updateCoins() {
        const p = this.player;

        for (let coin of this.coins) {
            if (coin.collected) continue;

            coin.animFrame += 0.1;

            if (p.x < coin.x + coin.w && p.x + p.width > coin.x &&
                p.y < coin.y + coin.h && p.y + (p.big ? 64 : 32) > coin.y) {

                coin.collected = true;
                this.state.coins++;
                this.state.score += 200;
                this.audio.play('coin');
            }
        }
    }

    updateParticles() {
        for (let particle of this.particles) {
            particle.x += particle.vx;
            particle.y += particle.vy;
            particle.vy += 0.3;
            particle.life -= 0.02;
        }
        this.particles = this.particles.filter(p => p.life > 0);
    }

    updatePowerups() {
        const p = this.player;

        for (let powerup of this.powerups) {
            if (powerup.collected) continue;

            powerup.y += powerup.vy;
            powerup.vy += 0.2;

            for (let tile of this.tiles) {
                if (tile.type === 'ground' || tile.type === 'brick') {
                    if (powerup.x < tile.x + tile.w && powerup.x + 28 > tile.x &&
                        powerup.y + 28 > tile.y && powerup.y < tile.y + tile.h) {
                        powerup.y = tile.y - 28;
                        powerup.vy = 0;
                        powerup.vx = powerup.vx || (Math.random() > 0.5 ? 2 : -2);
                    }
                }
            }

            powerup.x += powerup.vx;

            if (p.x < powerup.x + 28 && p.x + p.width > powerup.x &&
                p.y < powerup.y + 28 && p.y + (p.big ? 64 : 32) > powerup.y) {

                powerup.collected = true;

                if (powerup.type === 'mushroom') {
                    if (!p.big) {
                        p.big = true;
                        p.height = 64;
                        p.y -= 32;
                        this.state.score += 1000;
                        this.audio.play('powerup');
                    }
                } else if (powerup.type === 'coin') {
                    this.state.coins++;
                    this.state.score += 200;
                    this.audio.play('coin');
                }
            }

            if (powerup.y > 600) {
                powerup.collected = true;
            }
        }

        this.powerups = this.powerups.filter(p => !p.collected);
    }

    spawnPowerup(x, y) {
        this.powerups.push({
            x: x,
            y: y,
            vx: 0,
            vy: 0,
            type: Math.random() > 0.3 ? 'mushroom' : 'coin',
            collected: false
        });
    }

    createParticles(x, y, color, count = 8) {
        for (let i = 0; i < count; i++) {
            this.particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.8) * 8,
                color: color,
                life: 1
            });
        }
    }

    checkFlag() {
        if (this.flag.reached) return;

        const p = this.player;
        const flag = this.flag;

        if (p.x >= flag.x - 20 && p.x <= flag.x + 40) {
            flag.reached = true;
            this.levelComplete();
        }
    }

    playerDie() {
        if (this.player.dead) return;

        this.player.dead = true;
        this.audio.play('die');

        this.state.lives--;

        if (this.state.lives <= 0) {
            this.gameOver();
        } else {
            setTimeout(() => {
                this.respawn();
            }, 2000);
        }
    }

    respawn() {
        this.player = {
            x: 100,
            y: 300,
            width: 28,
            height: 32,
            vx: 0,
            vy: 0,
            grounded: false,
            facingRight: true,
            big: false,
            invincible: false,
            invincibleTimer: 0,
            dead: false,
            jumpCount: 0,
            canDoubleJump: true
        };

        this.state.cameraX = 0;
        this.state.time = 400;
        this.loadLevel(`1-${this.state.level}`);
    }

    levelComplete() {
        this.state.levelComplete = true;
        this.audio.play('flag');

        this.state.score += this.state.time * 10;
        this.state.score += this.state.coins * 100;

        setTimeout(() => {
            document.getElementById('win-screen').classList.remove('hidden');
            document.getElementById('win-score').textContent = `SCORE: ${this.state.score.toString().padStart(6, '0')}`;
        }, 1000);
    }

    nextLevel() {
        this.state.level++;

        if (this.state.level > 4) {
            this.state.level = 1;
            this.state.world++;
        }

        this.startGame(this.state.practiceMode);
    }

    gameOver() {
        this.state.gameOver = true;

        setTimeout(() => {
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = `SCORE: ${this.state.score.toString().padStart(6, '0')}`;
        }, 1000);
    }

    draw() {
        const ctx = this.ctx;
        const camX = this.state.cameraX;

        if (this.levels[`1-${this.state.level}`]?.underground) {
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        } else {
            // 天空蓝色背景
            ctx.fillStyle = '#5c94fc';
            ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

            // 地面区域
            ctx.fillStyle = '#c84c0c';
            ctx.fillRect(0, 448, this.canvas.width, this.canvas.height - 448);
        }

        ctx.save();
        ctx.translate(-camX, 0);

        this.drawDecorations();
        this.drawTiles();
        this.drawPipes();
        this.drawCoins();
        this.drawEnemies();
        this.drawPowerups();
        this.drawPlayer();
        this.drawParticles();

        ctx.restore();

        this.updateUI();
    }

    drawDecorations() {
        const ctx = this.ctx;

        for (let dec of this.decorations) {
            if (dec.type === 'cloud') {
                // 云朵 - 白色
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(dec.x + 20, dec.y + 15, 20, 0, Math.PI * 2);
                ctx.arc(dec.x + 50, dec.y + 15, 25, 0, Math.PI * 2);
                ctx.arc(dec.x + 80, dec.y + 15, 18, 0, Math.PI * 2);
                ctx.fill();
            } else if (dec.type === 'bush') {
                // 灌木 - 绿色
                ctx.fillStyle = '#228b22';
                ctx.beginPath();
                ctx.arc(dec.x + 20, dec.y + 20, 20, 0, Math.PI * 2);
                ctx.arc(dec.x + 50, dec.y + 15, 25, 0, Math.PI * 2);
                ctx.arc(dec.x + 80, dec.y + 20, 20, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    drawTiles() {
        for (let tile of this.tiles) {
            const ctx = this.ctx;

            if (tile.type === 'ground') {
                // 地面 - 棕色
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(tile.x, tile.y, 32, 32);
                // 草地纹理
                ctx.fillStyle = '#228b22';
                ctx.fillRect(tile.x, tile.y, 32, 4);
            } else if (tile.type === 'brick') {
                if (tile.type === 'broken') continue;
                // 砖块 - 橙红色
                ctx.fillStyle = '#cd5c5c';
                ctx.fillRect(tile.x, tile.y, 32, 32);
                // 砖缝
                ctx.strokeStyle = '#8b0000';
                ctx.lineWidth = 2;
                ctx.strokeRect(tile.x, tile.y, 32, 32);
                ctx.beginPath();
                ctx.moveTo(tile.x + 16, tile.y);
                ctx.lineTo(tile.x + 16, tile.y + 16);
                ctx.moveTo(tile.x, tile.y + 16);
                ctx.lineTo(tile.x + 32, tile.y + 16);
                ctx.stroke();
            } else if (tile.type === 'question') {
                if (tile.active) {
                    // 问号方块 - 金色闪烁
                    const flash = Math.sin(performance.now() / 150) > 0;
                    ctx.fillStyle = flash ? '#ffd700' : '#daa520';
                    ctx.fillRect(tile.x, tile.y, 32, 32);
                    // 问号
                    ctx.fillStyle = '#8b4513';
                    ctx.font = 'bold 20px Arial';
                    ctx.fillText('?', tile.x + 10, tile.y + 24);
                } else {
                    // 空方块
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(tile.x, tile.y, 32, 32);
                }
            } else if (tile.type === 'pole') {
                // 旗杆 - 绿色
                ctx.fillStyle = '#228b22';
                ctx.fillRect(tile.x + 2, tile.y, 8, 128);
            } else if (tile.type === 'flag') {
                // 旗子 - 彩色
                const wave = Math.sin(performance.now() / 200) * 3;
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.moveTo(tile.x + wave, tile.y);
                ctx.lineTo(tile.x + 40 + wave, tile.y + 15);
                ctx.lineTo(tile.x + wave, tile.y + 30);
                ctx.fill();
            } else if (tile.type === 'castle-wall') {
                // 城堡墙 - 灰色
                ctx.fillStyle = '#696969';
                ctx.fillRect(tile.x, tile.y, 32, 64);
                ctx.strokeStyle = '#404040';
                ctx.strokeRect(tile.x, tile.y, 32, 64);
            } else if (tile.type === 'castle-top') {
                // 城堡顶部
                ctx.fillStyle = '#696969';
                ctx.fillRect(tile.x, tile.y, 32, 32);
            }
        }
    }

    drawPipes() {
        const ctx = this.ctx;

        for (let pipe of this.pipes) {
            // 管道 - 绿色
            ctx.fillStyle = '#228b22';
            ctx.fillRect(pipe.x, pipe.y, pipe.w, pipe.h);
            // 管道高光
            ctx.fillStyle = '#32cd32';
            ctx.fillRect(pipe.x + 4, pipe.y, 8, pipe.h);
            // 管道轮廓
            ctx.strokeStyle = '#006400';
            ctx.lineWidth = 2;
            ctx.strokeRect(pipe.x, pipe.y, pipe.w, pipe.h);
        }

        for (let tile of this.tiles) {
            if (tile.type === 'pipe-up') {
                ctx.fillStyle = '#228b22';
                ctx.fillRect(tile.x, tile.y, 64, 64);
                ctx.fillStyle = '#32cd32';
                ctx.fillRect(tile.x + 8, tile.y, 12, 64);
                ctx.strokeStyle = '#006400';
                ctx.strokeRect(tile.x, tile.y, 64, 64);
            }
        }
    }

    drawCoins() {
        for (let coin of this.coins) {
            if (coin.collected) continue;

            const bounce = Math.sin(coin.animFrame) * 3;
            const ctx = this.ctx;

            // 金币 - 金色圆形
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(coin.x + 12, coin.y + 12 + bounce, 10, 0, Math.PI * 2);
            ctx.fill();

            // 金币闪光
            ctx.fillStyle = '#ffec8b';
            ctx.beginPath();
            ctx.arc(coin.x + 12, coin.y + 12 + bounce, 6, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    drawEnemies() {
        for (let enemy of this.enemies) {
            const ctx = this.ctx;
            const w = enemy.width;
            const h = enemy.height;

            if (enemy.type === 'goomba') {
                // 栗子龟 - 棕色
                ctx.fillStyle = '#8b4513';
                ctx.fillRect(enemy.x, enemy.y, w, h);
                // 眼睛
                ctx.fillStyle = '#fff';
                ctx.fillRect(enemy.x + 4, enemy.y + 4, 6, 6);
                ctx.fillRect(enemy.x + w - 10, enemy.y + 4, 6, 6);
                ctx.fillStyle = '#000';
                ctx.fillRect(enemy.x + 6, enemy.y + 6, 2, 2);
                ctx.fillRect(enemy.x + w - 8, enemy.y + 6, 2, 2);
            } else if (enemy.type === 'turtle') {
                // 乌龟 - 绿色
                ctx.fillStyle = '#228b22';
                ctx.fillRect(enemy.x, enemy.y, w, h);
                // 壳纹
                ctx.fillStyle = '#006400';
                ctx.fillRect(enemy.x + 4, enemy.y + 10, w - 8, 10);
                // 眼睛
                ctx.fillStyle = '#fff';
                ctx.fillRect(enemy.x + 4, enemy.y + 2, 6, 6);
                ctx.fillRect(enemy.x + w - 10, enemy.y + 2, 6, 6);
            }
        }
    }

    drawPowerups() {
        for (let powerup of this.powerups) {
            if (powerup.collected) continue;

            const ctx = this.ctx;
            const bounce = Math.sin(performance.now() / 100) * 2;

            if (powerup.type === 'mushroom') {
                // 蘑菇 - 红色顶部
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(powerup.x + 14, powerup.y + 14 + bounce, 14, Math.PI, 0);
                ctx.fill();
                // 蘑菇白色斑点
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(powerup.x + 8, powerup.y + 6 + bounce, 4, 0, Math.PI * 2);
                ctx.arc(powerup.x + 18, powerup.y + 8 + bounce, 3, 0, Math.PI * 2);
                ctx.fill();
                // 蘑菇柄
                ctx.fillStyle = '#fffae6';
                ctx.fillRect(powerup.x + 8, powerup.y + 14 + bounce, 12, 14);
            } else {
                // 金币
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(powerup.x + 14, powerup.y + 14 + bounce, 12, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    drawPlayer() {
        const p = this.player;
        if (p.dead) return;

        // 无敌闪烁效果
        if (p.invincible && Math.floor(performance.now() / 100) % 2 === 0) {
            return;
        }

        const ctx = this.ctx;
        const height = p.big ? 64 : 32;
        const width = p.width;

        // 绘制马里奥身体 (红色矩形)
        ctx.fillStyle = '#ff0000';
        ctx.fillRect(p.x, p.y, width, height);

        // 绘制帽子 (红色)
        ctx.fillStyle = '#cc0000';
        if (p.big) {
            ctx.fillRect(p.x, p.y, width, 12);
        } else {
            ctx.fillRect(p.x, p.y, width, 8);
        }

        // 绘制脸部 (肤色)
        ctx.fillStyle = '#ffcc99';
        const faceY = p.big ? p.y + 12 : p.y + 6;
        const faceH = p.big ? 16 : 12;
        ctx.fillRect(p.x + 4, faceY, width - 8, faceH);

        // 绘制眼睛 (黑色)
        ctx.fillStyle = '#000';
        if (p.facingRight) {
            ctx.fillRect(p.x + width - 8, faceY + 2, 4, 4);
        } else {
            ctx.fillRect(p.x + 4, faceY + 2, 4, 4);
        }

        // 绘制背带裤 (蓝色)
        ctx.fillStyle = '#0000ff';
        const pantsY = p.big ? p.y + 28 : p.y + 16;
        const pantsH = p.big ? 36 : 16;
        ctx.fillRect(p.x, pantsY, width, pantsH);

        // 绘制纽扣 (黄色)
        ctx.fillStyle = '#ffff00';
        if (p.big) {
            ctx.fillRect(p.x + 6, p.y + 32, 6, 6);
            ctx.fillRect(p.x + width - 12, p.y + 32, 6, 6);
        }

        // 绘制鞋子 (棕色)
        ctx.fillStyle = '#8b4513';
        if (p.big) {
            ctx.fillRect(p.x - 2, p.y + height - 8, 12, 8);
            ctx.fillRect(p.x + width - 10, p.y + height - 8, 12, 8);
        } else {
            ctx.fillRect(p.x - 2, p.y + height - 6, 10, 6);
            ctx.fillRect(p.x + width - 8, p.y + height - 6, 10, 6);
        }
    }

    drawParticles() {
        const ctx = this.ctx;
        for (let particle of this.particles) {
            ctx.globalAlpha = particle.life;
            ctx.fillStyle = particle.color;
            ctx.fillRect(particle.x, particle.y, 6, 6);
        }
        ctx.globalAlpha = 1;
    }

    drawSprite(x, y, sprite, scale = 1, flash = false) {
        const ctx = this.ctx;
        const colors = flash ? { 1: '#ffff00' } : sprite.colors;
        const map = sprite.map;

        map.forEach((row, r) => {
            row.forEach((col, c) => {
                if (col !== 0 && colors[col]) {
                    ctx.fillStyle = colors[col];
                    ctx.fillRect(
                        Math.floor(x + c * scale),
                        Math.floor(y + r * scale),
                        Math.ceil(scale),
                        Math.ceil(scale)
                    );
                }
            });
        });
    }

    updateUI() {
        document.getElementById('score-value').textContent = this.state.score.toString().padStart(6, '0');
        document.getElementById('coin-value').textContent = '×' + this.state.coins;
        document.getElementById('world-value').textContent = `1-${this.state.level}`;
        document.getElementById('time-value').textContent = this.state.time;

        let hearts = '';
        for (let i = 0; i < this.state.lives; i++) {
            hearts += '❤';
        }
        document.getElementById('life-icon').textContent = hearts;
    }

    gameLoop() {
        if (!this.state.running) return;

        const now = performance.now();
        const dt = Math.min(now - this.lastTime, 32);
        this.lastTime = now;

        this.update(dt);
        this.draw();

        if (this.state.running) {
            requestAnimationFrame(() => this.gameLoop());
        }
    }
}

const game = new MarioGame();
</script>
