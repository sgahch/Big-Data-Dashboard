<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汇数明监 · AI监管大数据智能看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: #f4f4f4;
            color: #161616;
            letter-spacing: 0.16px;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Header顶部栏 —— Carbon 白色导航 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo img {
            height: 52px;
            width: auto;
            transition: opacity 0.15s ease;
        }

        .header-logo img:hover {
            opacity: 0.85;
        }

        .header-title {
            flex: 1;
            text-align: left;
            font-size: 20px;
            font-weight: 600;
            color: #161616;
            letter-spacing: 0.16px;
            margin: 0 24px;
        }

        /* 导航栏 —— Carbon 方形 tab */
        .nav-bar {
            display: flex;
            align-items: stretch;
            height: 80px;
        }

        .nav-item {
            padding: 0 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            color: #525252;
            border: none;
            border-bottom: 3px solid transparent;
            border-radius: 0;
            background: transparent;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
        }

        .nav-item:hover {
            background: #f4f4f4;
            color: #161616;
        }

        .nav-item.active {
            color: #161616;
            font-weight: 600;
            border-bottom-color: #0f62fe;
            background: transparent;
        }

        /* 用户信息区域 */
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: 20px;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 0;
        }

        .user-name {
            color: #525252;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-name i {
            font-size: 18px;
            color: #525252;
        }

        .logout-btn {
            height: 40px;
            padding: 0 16px;
            background: #ffffff;
            border: 1px solid #0f62fe;
            border-radius: 0;
            color: #0f62fe;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            letter-spacing: 0.16px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logout-btn:hover {
            background: #0f62fe;
            color: #ffffff;
        }

        .logout-btn i {
            font-size: 12px;
        }

        /* 数据呈现页面样式 */
        .presentation-page {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 16px;
            padding: 96px 16px 16px 16px;
            height: 100vh;
            overflow: hidden;
        }

        .chart-panel {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            box-shadow: none;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.15s ease;
            position: relative;
        }

        .chart-panel:hover {
            border-color: #c6c6c6;
        }

        .chart-panel-title {
            color: #161616;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            letter-spacing: 0.16px;
        }

        .chart-panel-title i {
            font-size: 15px;
            color: #0f62fe;
        }

        .chart-content {
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 1400px) {
            .presentation-page {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .presentation-page {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(6, minmax(260px, 1fr));
                overflow-y: auto;
                height: calc(100vh - 80px);
            }
        }

        /* 页面容器 */
        .page {
            display: none;
            position: fixed;
            top: 80px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            overflow: hidden;
        }

        .page.active {
            display: block;
        }

        /* 数据采集页面布局 */
        .collection-page {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr auto;
            gap: 16px;
            padding: 16px;
            height: 100%;
            box-sizing: border-box;
        }

        .map-container {
            grid-row: 1 / 2;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            overflow: hidden;
            min-height: 500px;
            position: relative;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            min-height: 500px;
            border: none;
            display: block;
            background: transparent;
        }

        .right-panel {
            grid-row: 1 / 2;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .video-container {
            flex: 1;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            box-shadow: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .video-container h3 {
            margin-bottom: 15px;
            color: #161616;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.16px;
        }

        .video-container h3 i {
            color: #0f62fe;
            margin-right: 4px;
        }

        .stats-panel {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            box-shadow: none;
            padding: 24px;
        }

        .stats-panel h3 {
            margin-bottom: 20px;
            color: #161616;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.16px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            margin-bottom: 8px;
            background: #f4f4f4;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            color: #161616;
            transition: background 0.15s ease;
        }

        .stat-item:hover {
            background: #e8e8e8;
        }

        .stat-label {
            font-size: 14px;
            color: #525252;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 600;
            color: #161616;
        }

        .action-button-container {
            grid-column: 1 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .collect-button {
            padding: 14px 56px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            background: #0f62fe;
            border: none;
            border-radius: 0;
            cursor: pointer;
            box-shadow: none;
            transition: background 0.15s ease;
            position: relative;
            overflow: hidden;
            font-family: inherit;
            letter-spacing: 0.16px;
        }

        /* 水滴填充效果 */
        .collect-button .water-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, rgba(17, 146, 232, 0.9) 0%, rgba(0, 67, 206, 0.95) 100%);
            transition: height 3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 0;
        }

        /* 水波纹动画 */
        .collect-button .water-fill::before {
            content: '';
            position: absolute;
            top: -15px;
            left: -50%;
            width: 200%;
            height: 30px;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.35) 0%, transparent 70%);
            animation: wave 2s ease-in-out infinite;
        }

        @keyframes wave {
            0% {
                transform: translateX(0) translateY(0) rotate(0deg);
            }

            50% {
                transform: translateX(-25%) translateY(-3px) rotate(180deg);
            }

            100% {
                transform: translateX(-50%) translateY(0) rotate(360deg);
            }
        }

        /* 按钮文字在水滴上方 */
        .collect-button .button-text {
            position: relative;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .collect-button:hover {
            background: #0050e6;
        }

        .collect-button:active {
            background: #002d9c;
        }

        .collect-button.loading {
            cursor: not-allowed;
            pointer-events: none;
        }

        .collect-button.loading .water-fill {
            height: 100% !important;
        }

        /* 水滴图标动画 */
        .collect-button .drop-icon {
            display: inline-block;
            animation: drip 1.5s ease-in-out infinite;
        }

        @keyframes drip {

            0%,
            100% {
                transform: translateY(0) scale(1);
            }

            50% {
                transform: translateY(-3px) scale(1.1);
            }
        }

        /* 加载动画 */
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 提示消息 —— Carbon 反向 toast */
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 32px;
            background: #161616;
            color: #ffffff;
            border-left: 3px solid #0f62fe;
            border-radius: 0;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.16px;
            z-index: 9999;
            display: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .toast.show {
            display: block;
            animation: fadeInOut 2s;
        }

        @keyframes fadeInOut {

            0%,
            100% {
                opacity: 0;
            }

            10%,
            90% {
                opacity: 1;
            }
        }

        /* 其他页面占位样式 */
        .placeholder-page {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            font-size: 20px;
            color: #525252;
        }

        /* ========== 数据评估页面样式 ========== */
        .evaluation-page {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 16px;
            padding: 16px;
            height: 100%;
        }

        .eval-panel {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            box-shadow: none;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: border-color 0.15s ease;
        }

        .eval-panel:hover {
            border-color: #c6c6c6;
        }

        .eval-panel-title {
            color: #161616;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            letter-spacing: 0.16px;
        }

        .eval-panel-title i {
            font-size: 15px;
            color: #0f62fe;
        }

        .eval-chart {
            flex: 1;
            min-height: 0;
        }

        /* 热点新闻排行榜样式 */
        .hot-news-list {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .hot-news-item {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            margin-bottom: 6px;
            background: #f4f4f4;
            border-radius: 0;
            border-left: 3px solid transparent;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .hot-news-item:hover {
            background: #e8e8e8;
            border-left-color: #0f62fe;
        }

        .hot-news-rank {
            width: 24px;
            height: 24px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            margin-right: 10px;
            flex-shrink: 0;
            color: #fff;
        }

        .hot-news-rank.top1 {
            background: #da1e28;
        }

        .hot-news-rank.top2 {
            background: #ff832b;
        }

        .hot-news-rank.top3 {
            background: #f1c21b;
            color: #161616;
        }

        .hot-news-rank.normal {
            background: #e0e0e0;
            color: #525252;
        }

        .hot-news-content {
            flex: 1;
            min-width: 0;
        }

        .hot-news-title {
            font-size: 13px;
            color: #161616;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .hot-news-bar {
            height: 4px;
            border-radius: 0;
            background: #e0e0e0;
            overflow: hidden;
        }

        .hot-news-bar-inner {
            height: 100%;
            border-radius: 0;
            background: #0f62fe;
            transition: width 1s ease;
        }

        .hot-news-heat {
            font-size: 11px;
            color: #da1e28;
            margin-left: 10px;
            flex-shrink: 0;
            font-weight: 600;
        }

        /* ========== 数据处理页面样式 ========== */
        .processing-page {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 16px;
            height: 100%;
        }

        /* 左侧滚动名单 */
        .news-panel {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 地区筛选器 */
        .region-filter {
            padding: 14px 20px;
            background: #f4f4f4;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .region-filter i {
            color: #0f62fe;
            font-size: 15px;
        }

        .region-filter select {
            flex: 1;
            padding: 8px 12px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            color: #161616;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            transition: border-color 0.15s ease;
        }

        .region-filter select:hover {
            border-color: #8c8c8c;
        }

        .region-filter select:focus {
            border-color: #0f62fe;
        }

        .region-filter select option {
            background: #ffffff;
            color: #161616;
        }

        /* 滚动名单容器 */
        #news-scroll-container {
            flex: 1;
            overflow: hidden;
            position: relative;
            padding-top: 35px;
        }

        /* 模拟表头 - 强制固定布局 */
        #news-scroll-container>div:first-child {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 35px;
            z-index: 2;
            background: #e0e0e0;
            display: table;
            table-layout: fixed;
            width: calc(100% - 0px);
            box-sizing: border-box;
        }

        #news-scroll-container>div:first-child>div {
            display: table-cell;
            padding: 6px 8px;
            color: #161616 !important;
            font-weight: 600;
            border-bottom: 1px solid #c6c6c6 !important;
            font-size: 13px;
            box-sizing: border-box;
        }

        /* 滚动表格 - 强制固定布局 */
        .news-table {
            position: relative;
            z-index: 1;
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            box-sizing: border-box;
        }

        .news-table tbody {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .news-table tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.15s ease;
            box-sizing: border-box;
        }

        .news-table tbody tr:nth-child(even) {
            background: #fafafa;
        }

        .news-table tbody tr:hover {
            background: #f4f4f4;
            cursor: pointer;
        }

        /* 统一列宽设置 */
        .col-num {
            width: 10%;
        }

        .col-title {
            width: 45%;
        }

        .col-date {
            width: 15%;
        }

        .col-source {
            width: 30%;
        }

        .news-table td {
            padding: 5px 8px;
            color: #161616;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            box-sizing: border-box;
        }

        /* 标题列特殊处理 - 省略号 */
        .news-table td:nth-child(2) {
            max-width: 0;
        }

        .news-title-link {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.15s ease;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .news-title-link:hover {
            color: #0f62fe;
        }

        /* 滚动动画 */
        @keyframes scroll-up {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-50%);
            }
        }

        .news-scroll {
            animation: scroll-up 150s linear infinite;
        }

        .news-scroll:hover {
            animation-play-state: paused;
        }

        /* 右侧面板 */
        .right-panel-processing {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* AI客服面板 */
        .ai-chat-panel {
            flex: 1;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            box-shadow: none;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .ai-chat-panel h3 {
            margin-bottom: 15px;
            color: #161616;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.16px;
        }

        .ai-chat-panel h3 i {
            color: #0f62fe;
            margin-right: 4px;
        }

        #ai-chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            overflow: hidden;
            position: relative;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #f4f4f4;
            border-bottom: 1px solid #e0e0e0;
        }

        .chat-title {
            font-size: 12px;
            color: #161616;
            font-weight: 600;
        }

        .chat-actions {
            display: flex;
            gap: 8px;
        }

        .chat-action-btn {
            padding: 4px 12px;
            background: #ffffff;
            border: 1px solid #0f62fe;
            border-radius: 0;
            color: #0f62fe;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .chat-action-btn:hover {
            background: #0f62fe;
            color: #ffffff;
        }

        .chat-history-sidebar {
            display: none;
            position: absolute;
            left: 0;
            top: 45px;
            bottom: 60px;
            width: 200px;
            background: #ffffff;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            z-index: 10;
        }

        .chat-history-sidebar.show {
            display: block;
        }

        .chat-history-sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .chat-history-sidebar::-webkit-scrollbar-track {
            background: #f4f4f4;
        }

        .chat-history-sidebar::-webkit-scrollbar-thumb {
            background: #c6c6c6;
            border-radius: 3px;
        }

        .chat-history-item {
            padding: 8px 12px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.15s ease;
            font-size: 12px;
            color: #525252;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-history-item:hover {
            background: #f4f4f4;
        }

        .chat-history-item.active {
            background: #e0e0e0;
            border-left: 2px solid #0f62fe;
            color: #161616;
        }

        .chat-history-item .delete-btn {
            color: #8c8c8c;
            font-size: 10px;
        }

        .chat-history-item .delete-btn:hover {
            color: #da1e28;
        }

        .empty-history {
            padding: 20px 12px;
            text-align: center;
            color: #8c8c8c;
            font-size: 11px;
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-history::-webkit-scrollbar {
            width: 6px;
        }

        .chat-history::-webkit-scrollbar-track {
            background: #f4f4f4;
            border-radius: 3px;
        }

        .chat-history::-webkit-scrollbar-thumb {
            background: #c6c6c6;
            border-radius: 3px;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '';
            }

            40% {
                content: '.';
            }

            60% {
                content: '..';
            }

            80%,
            100% {
                content: '...';
            }
        }

        .chat-message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chat-message.user {
            flex-direction: row-reverse;
        }

        .chat-avatar {
            width: 28px;
            height: 28px;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            color: #ffffff;
        }

        .chat-message.ai .chat-avatar {
            background: #0f62fe;
        }

        .chat-message.user .chat-avatar {
            background: #393939;
        }

        .chat-bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 0;
            line-height: 1.5;
            font-size: 12px;
            word-wrap: break-word;
        }

        .chat-message.ai .chat-bubble {
            background: #f4f4f4;
            border: 1px solid #e0e0e0;
            color: #161616;
        }

        .chat-message.user .chat-bubble {
            background: #0f62fe;
            border: 1px solid #0f62fe;
            color: #ffffff;
        }

        .chat-message.user .chat-bubble a {
            color: #ffffff !important;
            text-decoration: underline;
        }

        .chat-input-area {
            padding: 12px 15px;
            background: #f4f4f4;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 8px 12px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            color: #161616;
            font-size: 12px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .chat-input:focus {
            border-color: #0f62fe;
        }

        .chat-input::placeholder {
            color: #8c8c8c;
        }

        .chat-send-btn {
            padding: 8px 20px;
            background: #0f62fe;
            border: none;
            border-radius: 0;
            color: #ffffff;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .chat-send-btn:hover {
            background: #0050e6;
        }

        /* 统计面板 */
        .stats-panel-processing {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            box-shadow: none;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            background: #f4f4f4;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: background 0.15s ease;
        }

        .stat-card:hover {
            background: #e8e8e8;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            background: #0f62fe;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #ffffff;
        }

        .stat-info {
            flex: 1;
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: #525252;
            margin-bottom: 5px;
        }

        .stat-card .stat-value {
            font-size: 20px;
            font-weight: 600;
            color: #161616;
        }

        .export-report-btn {
            grid-column: 1 / 3;
            padding: 12px 30px;
            background: #0f62fe;
            border: none;
            border-radius: 0;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.16px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .export-report-btn:hover {
            background: #0050e6;
        }

        /* 导出格式选择弹窗 */
        .export-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .export-modal.show {
            display: flex;
        }

        .export-modal-content {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            min-width: 400px;
            animation: modalFadeIn 0.2s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .export-modal-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .export-modal-header h3 {
            color: #161616;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.16px;
        }

        .export-modal-header p {
            color: #525252;

        }

        .export-options {

            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .export-option {
            background: #f4f4f4;
            border: 1px solid #e0e0e0;
            border-radius: 0;
            padding: 20px;
            text-align: center;

        .export-option:hover {

        .export-option i {
            font-size: 32px;
            color: #0f62fe;
            margin-bottom: 10px;

        }

        .export-option .format-name {

            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .export-option .format-desc {
            color: #525252;
            font-size: 11px;
        }

        .export-modal-footer {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .export-modal-btn {

            border-radius: 0;

        }

            background: #0050e6;
        }

        .export-modal-btn.confirm:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <!-- Header顶部栏 -->
    <div class="header">
        <div class="header-logo">
            <img src="/assets/logo-icon.png" alt="汇数明监 · AI监管大数据智能看板">

        <div class="header-title">

        <div class="nav-bar">
            <div class="nav-item active" onclick="switchPage('collection')">数据采集</div>
            <div class="nav-item" onclick="switchPage('processing')">数据处理</div>
            <div class="nav-item" onclick="switchPage('presentation')">数据呈现</div>

    <!-- 数据采集页面 -->
    <div id="collection" class="page active">
        <div class="collection-page">
            <!-- 左侧：3D地图 -->
            <div class="map-container">
                <iframe src="/shaanxi_3d_map.html"></iframe>
            </div>

            <!-- 右侧面板 -->
            <div class="right-panel">
                <!-- 视频播放器 -->
                <div class="video-container">
                    <h3><i class="fas fa-video"></i> 数据采集演示</h3>
                    <video controls autoplay muted playsinline loop preload="metadata"
                        style="width: 100%; flex: 1; background: #000; border: 1px solid #e0e0e0;"
                        onerror="this.insertAdjacentHTML('afterend','<div style=\'margin-top:10px;padding:10px;border:1px solid rgba(255,99,99,.4);border-radius:6px;color:#ffb3b3;background:rgba(255,99,99,.08);font-size:12px;\'>视频加载失败：请检查链接是否可访问：/assets/data-collection-demo.mp4</div>')">
                        <source src="/assets/data-collection-demo.mp4" type="video/mp4">
                        您的浏览器不支持视频播放，请访问：/assets/data-collection-demo.mp4
                    </video>

                </div>

                <!-- 统计面板 -->
                <div class="stats-panel">
                    <h3><i class="fas fa-chart-bar"></i> 采集统计</h3>
                    <div class="stat-item">
                        <span class="stat-label"><i class="fas fa-map-marked-alt"></i> 采集地区数量</span>
                        <span class="stat-value">10 个</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label"><i class="fas fa-globe"></i> 新闻网站数量</span>
                        <span class="stat-value">6 个</span>
                    </div>
                </div>
            </div>

            <!-- 底部按钮 -->
            <div class="action-button-container">
                <button class="collect-button" onclick="startCollection()">
                    <div class="water-fill"></div>
                    <span class="button-text">
                        <i class="fas fa-tint drop-icon"></i> 一键采集数据
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- 数据处理页面 -->
    <div id="processing" class="page">
        <div class="processing-page">
            <!-- 左侧：滚动名单 -->
            <div class="news-panel">
                <!-- 地区筛选器 -->
                <div class="region-filter">
                    <i class="fas fa-filter"></i>
                    <select id="region-filter-select" onchange="filterNewsByRegion(this.value)">
                        <option value="all">全部地区</option>
                        <option value="西安">西安市</option>
                        <option value="宝鸡">宝鸡市</option>
                        <option value="咸阳">咸阳市</option>
                        <option value="渭南">渭南市</option>
                        <option value="铜川">铜川市</option>
                        <option value="延安">延安市</option>
                        <option value="榆林">榆林市</option>
                        <option value="汉中">汉中市</option>
                        <option value="安康">安康市</option>
                        <option value="商洛">商洛市</option>

                </div>

                <!-- 滚动名单容器 -->

            </div>

            <!-- 右侧面板 -->
            <div class="right-panel-processing">
                <!-- AI客服 -->
                <div class="ai-chat-panel">
                    <h3><i class="fas fa-robot"></i> 纪检AI智能助手</h3>
                    <div id="ai-chat-container"></div>
                </div>

                <!-- 统计面板 -->
                <div class="stats-panel-processing">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-map-marked-alt"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">已爬取地区</div>
                            <div class="stat-value">10 个</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-newspaper"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">新闻总数</div>
                            <div class="stat-value" id="total-news-count">0 条</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-clock"></i></div>
                        <div class="stat-info">
                            <div class="stat-label">最后更新</div>
                            <div class="stat-value" id="last-update-time">--</div>
                        </div>
                    </div>
                    <button class="export-report-btn" onclick="exportReport()">
                        <i class="fas fa-file-export"></i> 导出报告
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 数据呈现页面 -->
    <div id="presentation" class="page">
        <div class="presentation-page">
            <div class="chart-panel">
                <h3 class="chart-panel-title"><i class="fas fa-chart-bar"></i> 案件查处呈现统计</h3>
                <div id="chart-cases" class="chart-content"></div>
            </div>

            <div class="chart-panel">
                <h3 class="chart-panel-title"><i class="fas fa-chart-pie"></i> 违规事项分布呈现</h3>
                <div id="chart-violations" class="chart-content"></div>
            </div>

            <div class="chart-panel">
                <h3 class="chart-panel-title"><i class="fas fa-city"></i> 地区案件排名TOP10</h3>
                <div id="chart-region-rank" class="chart-content"></div>
            </div>

            <div class="chart-panel">
                <h3 class="chart-panel-title"><i class="fas fa-tags"></i> 热点关键词分析</h3>
                <div id="chart-keyword-cloud" class="chart-content"></div>
            </div>

            <div class="chart-panel">
                <h3 class="chart-panel-title"><i class="fas fa-sitemap"></i> 数据来源构成分析</h3>
                <div id="chart-source-distribution" class="chart-content"></div>
            </div>

            <div class="chart-panel">
                <h3 class="chart-panel-title"><i class="fas fa-radar-chart"></i> 风险维度综合雷达</h3>
                <div id="chart-risk-radar" class="chart-content"></div>
            </div>
        </div>
    </div>

    <!-- 数据评估页面 -->
    <div id="evaluation" class="page">
        <div class="evaluation-page">
            <!-- 面板1: 数据质量综合评分 -->
            <div class="eval-panel">
                <div class="eval-panel-title"><i class="fas fa-tachometer-alt"></i> 数据质量综合评分</div>
                <div class="eval-chart" id="eval-chart-gauge"></div>
            </div>
            <!-- 面板2: 各地区案件热力雷达图 -->
            <div class="eval-panel">
                <div class="eval-panel-title"><i class="fas fa-broadcast-tower"></i> 各地区监察力度评估</div>
                <div class="eval-chart" id="eval-chart-radar"></div>
            </div>
            <!-- 面板3: 月度数据趋势分析 -->
            <div class="eval-panel">
                <div class="eval-panel-title"><i class="fas fa-chart-area"></i> 月度数据趋势分析</div>
                <div class="eval-chart" id="eval-chart-trend"></div>
            </div>
            <!-- 面板4: 案件类型分布极坐标 -->
            <div class="eval-panel">
                <div class="eval-panel-title"><i class="fas fa-solar-panel"></i> 案件类型分布极坐标</div>
                <div class="eval-chart" id="eval-chart-polar"></div>
            </div>
            <!-- 面板5: 数据来源漏斗分析 -->
            <div class="eval-panel">
                <div class="eval-panel-title"><i class="fas fa-filter"></i> 数据处理漏斗分析</div>
                <div class="eval-chart" id="eval-chart-funnel"></div>
            </div>
            <!-- 面板6: 今日热点新闻排行榜 -->
            <div class="eval-panel">
                <div class="eval-panel-title"><i class="fas fa-fire"></i> 今日热点新闻排行榜</div>
                <div class="hot-news-list" id="hot-news-list"></div>

    <!-- 提示消息 -->
    <div id="toast" class="toast"></div>

    <!-- 导出格式选择弹窗 -->
    <div id="export-modal" class="export-modal">
        <div class="export-modal-content">
            <div class="export-modal-header">
                <h3><i class="fas fa-file-export"></i> 选择导出格式</h3>
                <p>请选择您需要的报告格式</p>
            </div>
            <div class="export-options">
                <div class="export-option" data-format="pdf" onclick="selectExportFormat('pdf')">
                    <i class="fas fa-file-pdf"></i>
                    <div class="format-name">PDF</div>
                    <div class="format-desc">便于阅读和打印</div>
                </div>
                <div class="export-option" data-format="word" onclick="selectExportFormat('word')">
                    <i class="fas fa-file-word"></i>
                    <div class="format-name">Word</div>
                    <div class="format-desc">可编辑文档</div>
                </div>
                <div class="export-option" data-format="excel" onclick="selectExportFormat('excel')">
                    <i class="fas fa-file-excel"></i>
                    <div class="format-name">Excel</div>
                    <div class="format-desc">数据分析表格</div>
                </div>
            </div>
            <div class="export-modal-footer">
                <button class="export-modal-btn cancel" onclick="closeExportModal()">
                    <i class="fas fa-times"></i> 取消
                </button>
                <button class="export-modal-btn confirm" id="confirm-export-btn" onclick="confirmExport()" disabled>
                    <i class="fas fa-download"></i> 确认导出
                </button>
            </div>
        </div>

    <script>
        // ========== API配置常量 ==========
        const API_BASE_URL = window.location.origin;
        const AI_CHAT_URL = `${API_BASE_URL}/api/ai/chat`;

        // ========== 登录检查 ==========
        function checkLogin() {
            let username = localStorage.getItem('username');
            let isLoggedIn = localStorage.getItem('isLoggedIn');

            // 未登录则自动以访客身份进入（Vercel 静态部署无后端，禁用登录跳转）
            if (!isLoggedIn || isLoggedIn !== 'true') {
                username = username || '访客';
                localStorage.setItem('username', username);
                localStorage.setItem('isLoggedIn', 'true');
            }

            // 显示用户名
            document.getElementById('current-username').textContent = username;

            return true;
        }

        // ========== 登出功能 ==========
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                // 清除登录状态后直接刷新页面（checkLogin 会以访客身份自动恢复）
                localStorage.removeItem('username');
                localStorage.removeItem('isLoggedIn');
                window.location.reload();
            }
        }

        // 页面加载时检查登录状态
        window.addEventListener('DOMContentLoaded', function () {
            checkLogin();
        });

        // 页面切换
        function switchPage(pageName) {
            // 隐藏所有页面
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });

            // 移除所有导航项的激活状态
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });

            // 显示选中的页面
            document.getElementById(pageName).classList.add('active');

            // 激活对应的导航项
            event.target.classList.add('active');

            // 如果切换到数据处理页面，初始化数据
            if (pageName === 'processing') {
                loadNewsData();
                initAIChat();
            }

            // 如果切换到数据呈现页面，初始化图表
            if (pageName === 'presentation') {
                initPresentationCharts();
            }

            // 如果切换到数据评估页面，初始化评估图表
            if (pageName === 'evaluation') {
                initEvaluationPage();
            }
        }

        // 显示提示消息
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 一键采集数据
        function startCollection() {
            const button = document.querySelector('.collect-button');
            const buttonText = button.querySelector('.button-text');
            const waterFill = button.querySelector('.water-fill');

            // 防止重复点击
            if (button.classList.contains('loading')) {
                return;
            }

            // 先重置水滴高度（立即重置，无动画）
            waterFill.style.transition = 'none';
            waterFill.style.height = '0%';

            // 强制浏览器重绘
            waterFill.offsetHeight;

            // 恢复transition，准备开始动画
            waterFill.style.transition = 'height 3s cubic-bezier(0.4, 0, 0.2, 1)';

            // 显示加载状态
            button.classList.add('loading');
            buttonText.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在采集数据...';

            // 模拟数据采集过程（3秒）
            setTimeout(() => {
                // 恢复按钮状态
                button.classList.remove('loading');

                // 恢复按钮文字
                buttonText.innerHTML = '<i class="fas fa-tint drop-icon"></i> 一键采集数据';

                // 显示成功提示
                showToast('✓ 数据采集成功！当前已是最新数据');

                // 更新新闻数量
                loadNewsData();

                // 延迟重置水滴（等待一小段时间让用户看到满的效果）
                setTimeout(() => {
                    waterFill.style.transition = 'height 0.5s ease-out';
                    waterFill.style.height = '0%';

                    // 恢复原始transition
                    setTimeout(() => {
                        waterFill.style.transition = 'height 3s cubic-bezier(0.4, 0, 0.2, 1)';
                    }, 500);
                }, 500);
            }, 3000);
        }

        // ========== 数据处理页面功能 ==========
        let allNewsData = [];
        let filteredNewsData = [];

        // 模拟新闻数据
        const mockNewsData = [

        // 加载新闻数据（从API获取真实数据）
        async function loadNewsData() {
            // 先显示Mock数据，不阻塞页面
            allNewsData = mockNewsData;
            filteredNewsData = allNewsData;
            renderNewsTable();
            updateStats();
            console.log('✅ 已显示Mock数据，后台正在加载最新数据...');

            // 后台异步加载真实数据
            try {
                let url = `${API_BASE_URL}/api/news/?page_size=1000`;  // 添加page_size参数获取更多数据
                const regionSelect = document.getElementById('region-filter-select');
                const region = regionSelect ? regionSelect.value : 'all';

                if (region && region !== 'all') {
                    url += `&region=${region}`;
                }

                console.log(`正在请求Django API: ${url}`);

                // 添加超时处理（8秒超时）
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                console.log('Django API响应:', result);

                // 处理不同的返回格式
                let dataArray = [];
                if (Array.isArray(result)) {
                    dataArray = result;
                } else if (result.results && Array.isArray(result.results)) {
                    dataArray = result.results;
                } else if (result.code === 0 && Array.isArray(result.data)) {
                    dataArray = result.data;
                } else if (result.code === 0 && result.data && result.data.results) {
                    dataArray = result.data.results;
                } else {
                    throw new Error('API返回数据格式异常');
                }

                // 转换为前端需要的格式
                allNewsData = dataArray.map(item => {
                    // 提取地区名称，统一格式
                    let regionName = item.region_name || item.source || '清风网';
                    // 移除"市"字，统一为城市名称（如"西安市" -> "西安"）
                    regionName = regionName.replace(/市$/, '');

                    return {
                        id: item.id,
                        title: item.title,
                        date: item.date ? (item.date.substring ? item.date.substring(0, 10) : item.date) : '',
                        region: regionName,
                        url: item.url,
                        source: item.source || '清风网'
                    };
                });

                if (allNewsData.length > 0) {
                    filteredNewsData = allNewsData;
                    renderNewsTable();
                    updateStats();
                    console.log('✅ 成功加载真实数据:', allNewsData.length, '条');
                } else {
                    console.warn('⚠️ API返回数据为空，继续使用Mock数据');
                }

            } catch (error) {
                if (error.name === 'AbortError') {
                    console.warn('⚠️ API请求超时（8秒），使用Mock数据');
                } else {
                    console.error('加载新闻数据失败:', error);
                }
                // 继续使用Mock数据
            }
        }

        // 保存当前对话
        function saveCurrentConversation() {
            const history = document.getElementById('chat-history');
            if (!history) return;

            const messages = [];
            history.querySelectorAll('.chat-message').forEach(msg => {
                const type = msg.classList.contains('user') ? 'user' : 'ai';
                const content = msg.querySelector('.chat-bubble').innerHTML;
                // 跳过欢迎语
                if (!msg.querySelector('.chat-bubble').textContent.includes('您好！我是汇数明监智能助手')) {
                    messages.push({ type, content });
                }
            });

            if (messages.length === 0) return;

            // 获取对话标题（第一条用户消息的前20个字符）
            const firstUserMsg = messages.find(m => m.type === 'user');
            const title = firstUserMsg
                ? firstUserMsg.content.replace(/<[^>]*>/g, '').substring(0, 20) + '...'
                : '新对话';

            // 更新或添加对话
            const existingIdx = conversations.findIndex(c => c.id === conversationId);
            if (existingIdx >= 0) {
                conversations[existingIdx].title = title;
                conversations[existingIdx].messages = messages;
            } else {
                conversations.unshift({
                    id: conversationId,
                    title: title,
                    messages: messages,
                    createdAt: new Date().toISOString()
                });
            }

            // 只保留最近20个对话
            conversations = conversations.slice(0, 20);
            localStorage.setItem('ai_conversations', JSON.stringify(conversations));
            renderConversationList();
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            if (!input) return;

            const message = input.value.trim();
            if (!message) return;

            // 添加用户消息
            addMessage('user', message);
            input.value = '';

            // 添加AI加载状态
            const loadingId = addMessage('ai', '<span class="loading-dots">正在思考</span>');

            try {
                // 调用后端AI代理API
                const response = await fetch(AI_CHAT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        user_id: 'web_user_' + Date.now()
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.message || `API返回错误: ${response.status}`);
                }

                const result = await response.json();

                removeMessage(loadingId);

                if (result.code === 0 && result.data && result.data.reply) {
                    // 格式化回复内容
                    const formattedReply = formatReply(result.data.reply);
                    addMessage('ai', formattedReply);
                    // 保存对话
                    saveCurrentConversation();
                } else {
                    addMessage('ai', '抱歉，我现在有点忙，请稍后再试。');
                }

            } catch (error) {
                console.error('AI接口调用失败:', error);
                removeMessage(loadingId);
                addMessage('ai', `抱歉，AI服务暂时不可用。请稍后再试。`);
            }
        }

        // 格式化AI回复内容
        function formatReply(text) {
            if (!text) return '';

            // 处理换行符
            let formatted = text.replace(/\n/g, '<br>');

            // 处理多空格
            formatted = formatted.replace(/ {2,}/g, '&nbsp;&nbsp;');

            // 处理emoji
            formatted = formatted.replace(/✅/g, '<span style="color:#0f62fe">✅</span>');
            formatted = formatted.replace(/❌/g, '<span style="color:#9f1853">❌</span>');
            formatted = formatted.replace(/⚠️/g, '<span style="color:#b28600">⚠️</span>');
            formatted = formatted.replace(/🔔/g, '<span style="color:#6929c4">🔔</span>');
            formatted = formatted.replace(/💡/g, '<span style="color:#24a148">💡</span>');

            // 处理Markdown格式
            // 加粗
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // 斜体
            formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
            // 列表
            formatted = formatted.replace(/^- (.*$)/gm, '<li>$1</li>');
            // 链接
            formatted = formatted.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" style="color:#0f62fe">$1</a>');

            return formatted;
        }

            `;

            history.appendChild(messageDiv);
            history.scrollTop = history.scrollHeight;

            return messageId;
        }

        async function confirmExport() {
            if (!selectedExportFormat) {
                showToast('⚠️ 请选择导出格式');
                return;
            }

            const confirmBtn = document.getElementById('confirm-export-btn');
            const originalText = confirmBtn.innerHTML;

            try {
                // 显示加载状态
                confirmBtn.disabled = true;
                confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';

                // 调用后端API生成报告
                const response = await fetch(`${API_BASE_URL}/api/stats/report`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        type: selectedExportFormat
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                // 获取文件名
                const contentDisposition = response.headers.get('Content-Disposition');
                let filename = `纪检监察报告_${new Date().toISOString().split('T')[0]}`;

                if (contentDisposition) {
                    const matches = /filename="?(.+)"?/i.exec(contentDisposition);
                    if (matches && matches[1]) {
                        filename = decodeURIComponent(matches[1]);
                    }
                } else {
                    // 根据格式添加扩展名
                    const extensions = {
                        'pdf': '.pdf',
                        'word': '.docx',
                        'excel': '.xlsx'
                    };
                    filename += extensions[selectedExportFormat] || '';
                }

                // 下载文件
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                // 显示成功提示
                showToast(`✓ ${selectedExportFormat.toUpperCase()}报告导出成功！`);

                // 关闭弹窗
                closeExportModal();

            } catch (error) {
                console.error('导出报告失败:', error);
                showToast('✗ 导出失败，请稍后重试');
            } finally {
                // 恢复按钮状态
                confirmBtn.disabled = false;
                confirmBtn.innerHTML = originalText;
            }
        }

        // 渲染案件查处统计图表
        function renderCasesChart(tagStats) {
            if (!casesChart) return;

            const tagNames = tagStats.map(t => t.name);
            const tagValues = tagStats.map(t => t.value);
            const total = tagValues.reduce((a, b) => a + b, 0);

            // 计算占比
            const percentages = tagValues.map(v => ((v / total) * 100).toFixed(1));

            // 计算累积趋势
            const cumulative = [];
            let cumSum = 0;
            for (let v of tagValues) {
                cumSum += v;
                cumulative.push(cumSum);
            }

            const option = {
                backgroundColor: 'transparent',
                title: {
                    text: '违规类型分布统计',
                    subtext: `总计 ${total} 条案件`,

                    textStyle: { color: '#525252', fontSize: 16, fontWeight: 'bold' },

                        params.forEach(p => {
                            const marker = `<span style="display:inline-block;margin-right:4px;border-radius:10px;width:10px;height:10px;background-color:${p.color};"></span>`;
                            const value = p.seriesName === '占比(%)' ? `${p.value}%` : `${p.value}件`;
                            result += `${marker}${p.seriesName}: ${value}<br/>`;
                        });
                        return result;
                    }
                },
                legend: {
                    data: ['案件数', '占比(%)', '累积趋势'],

                    right: '5%',

        // 图表6: 今日热点新闻排行榜
        function initHotNewsList() {
            const container = document.getElementById('hot-news-list');
            if (!container) return;

            const hotNewsData = [
                { title: '中央纪委国家监委公开通报十起违反中央八项规定精神典型问题', heat: 9856 },
                { title: '全国纪检监察机关上半年处分省部级干部21人', heat: 8732 },
                { title: '二十届中央第三轮巡视反馈情况全部公布', heat: 7645 },
                { title: '陕西省纪委监委通报5起群众身边不正之风和腐败问题典型案例', heat: 6890 },
                { title: '中央纪委国家监委网站发布审查调查消息：3名厅级干部被查', heat: 6234 },
                { title: '深入推进党风廉政建设和反腐败斗争专题报道', heat: 5678 },
                { title: '全省纪检监察系统开展教育整顿工作综述', heat: 5123 },
                { title: '关于加强新时代廉洁文化建设的实施意见发布', heat: 4567 },
                { title: '各级纪检监察机关持续深化整治形式主义官僚主义', heat: 3980 },
                { title: '省纪委监委举办纪检监察干部业务培训班开班', heat: 3456 }
            ];

            const maxHeat = hotNewsData[0].heat;
            let html = '';
            hotNewsData.forEach((item, i) => {
                const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : 'normal';
                const barWidth = ((item.heat / maxHeat) * 100).toFixed(0);
                html += `
                    <div class="hot-news-item" title="${item.title}">
                        <div class="hot-news-rank ${rankClass}">${i + 1}</div>
                        <div class="hot-news-content">
                            <div class="hot-news-title">${item.title}</div>
                            <div class="hot-news-bar"><div class="hot-news-bar-inner" style="width: ${barWidth}%"></div></div>
                        </div>
                        <div class="hot-news-heat"><i class="fas fa-fire" style="margin-right:3px"></i>${(item.heat / 10000).toFixed(1)}w</div>
                    </div>`;
            });
            container.innerHTML = html;

            // 自动滚动效果
            const listHeight = container.scrollHeight;
            const viewHeight = container.clientHeight;
            if (listHeight > viewHeight) {
                let scrollPos = 0;
                const scrollSpeed = 0.5;
                function autoScroll() {
                    scrollPos += scrollSpeed;
                    if (scrollPos >= listHeight - viewHeight) scrollPos = 0;
                    container.scrollTop = scrollPos;
                    requestAnimationFrame(autoScroll);
                }
                container.style.overflow = 'hidden';
                // 悬停暂停
                let animId;
                const startScroll = () => { animId = requestAnimationFrame(autoScroll); };
                container.addEventListener('mouseenter', () => { cancelAnimationFrame(animId); });
                container.addEventListener('mouseleave', startScroll);
                startScroll();
            }
        }
