<!DOCTYPE html>
<html lang='zh-CN'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>登录 - 纪检监察大数据可视化平台</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .login-left {
            flex: 0 0 38%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 80px;
            position: relative;
        }

        .logo-section {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-section img {
            height: 55px;
            width: auto;
        }

        .logo-text h2 {
            font-size: 18px;
            color: #1a1a1a;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .logo-text p {
            font-size: 11px;
            color: #666666;
            letter-spacing: 0.5px;
        }

        .login-form-container {
            width: 100%;
            max-width: 380px;
        }

        .form-title {
            font-size: 32px;
            color: #1a1a1a;
            font-weight: 600;
            margin-bottom: 50px;
            text-align: left;
        }

        .input-group {
            margin-bottom: 28px;
        }

        .input-group label {
            display: block;
            font-size: 15px;
            color: #333333;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            height: 50px;
            padding: 0 18px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
            background: #fafafa;
        }

        .input-group input:focus {
            border-color: #c41e3a;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(196, 30, 58, 0.08);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666666;
            cursor: pointer;
        }

        .remember-me input[type='checkbox'] {
            width: 17px;
            height: 17px;
            cursor: pointer;
            accent-color: #c41e3a;
        }

        .forgot-password {
            color: #1a73e8;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #1557b0;
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            height: 52px;
            background: #c41e3a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .login-button:hover {
            background: #a01828;
            box-shadow: 0 6px 20px rgba(196, 30, 58, 0.35);
            transform: translateY(-1px);
        }

        .login-right {
            flex: 1;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8c 50%, #3a6fa5 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }

        .login-right::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }

        .star-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .star-icon::before {
            content: '';
            font-size: 80px;
            color: #ffd700;
            text-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
        }

        .brand-title {
            font-size: 56px;
            color: #ffffff;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
            letter-spacing: 8px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
        }

        .brand-subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            margin-bottom: 60px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .platform-buttons {
            display: flex;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .platform-btn {
            padding: 14px 32px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .platform-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 1024px) {
            .login-left {
                flex: 0 0 45%;
                padding: 40px 50px;
            }

            .brand-title {
                font-size: 42px;
            }
        }

        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
            }

            .login-left {
                flex: 0 0 100%;
            }

            .login-right {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class='login-wrapper'>
        <div class='login-left'>
            <div class='logo-section'>
                <img src='https://dis.xawl.edu.cn/resources/images/logo.png' alt='西安文理学院'>

            </div>
            <div class='login-form-container'>
                <h1 class='form-title'>系统登录</h1>
                <form id='loginForm'>
                    <div class='input-group'>
                        <label for='username'>账号</label>
                        <input type='text' id='username' placeholder='请输入账号' required>
                    </div>
                    <div class='input-group'>
                        <label for='password'>密码</label>
                        <input type='password' id='password' placeholder='请输入密码' required>
                    </div>
                    <div class='form-options'>
                        <label class='remember-me'>
                            <input type='checkbox' id='remember'>
                            <span>记住密码</span>
                        </label>
                        <a href='forgot-password.html' class='forgot-password'>忘记密码</a>
                    </div>
                    <button type='submit' class='login-button'>登 录</button>
                </form>
            </div>
        </div>
        <div class='login-right'>
            <div class='star-icon'></div>
            <h1 class='brand-title'>数字赋能纪检监察 科技助力防腐倡廉</h1>
            <p class='brand-subtitle'>纪检监察大数据分析平台</p>
            <div class='platform-buttons'>
                <button class='platform-btn' onclick='window.location.href=\"index.html\"'>数据采集</button>
                <button class='platform-btn' onclick='window.location.href=\"index.html\"'>数据处理</button>
                <button class='platform-btn' onclick='window.location.href=\"index.html\"'>数据呈现</button>
                <button class='platform-btn' onclick='window.location.href=\"index.html\"'>数据评估</button>
            </div>
        </div>
    </div>
    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember').checked;
            if (!username || !password) {
                alert('请输入账号和密码');
                return;
            }
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ username, password, remember_me: rememberMe })
                });
                const data = await response.json();
                if (response.ok && data.code === 0) {
                    if (rememberMe) {
                        localStorage.setItem('remembered_username', username);
                    }
                    window.location.href = '/index.html';
                } else {
                    alert('登录失败：' + (data.message || '用户名或密码错误'));
                }
            } catch (error) {
                console.error('登录错误:', error);
                alert('登录失败，请重试');
            }
        });
        const rememberedUsername = localStorage.getItem('remembered_username');
        if (rememberedUsername) {
            document.getElementById('username').value = rememberedUsername;
            document.getElementById('remember').checked = true;
        }
    </script>
</body>

</html>
