<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 A · 深色精致（Linear 风）— 纪检监察大数据可视化平台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  /* ============ 设计 Token（源自 Linear 设计系统） ============ */
  :root{
    --canvas:#010102;
    --surface-1:#0f1011;
    --surface-2:#141516;
    --surface-3:#18191a;
    --hairline:#23252a;
    --hairline-strong:#34343a;
    --ink:#f7f8f8;
    --ink-muted:#d0d6e0;
    --ink-subtle:#8a8f98;
    --ink-tertiary:#62666d;
    --primary:#5e6ad2;
    --primary-hover:#828fff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Inter','SF Pro Display','Microsoft YaHei',-apple-system,system-ui,sans-serif;
    background:var(--canvas);
    color:var(--ink);
    overflow:hidden;height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ 顶栏 56px ============ */
  .header{
    position:fixed;top:0;left:0;width:100%;height:56px;z-index:1000;
    background:var(--canvas);
    border-bottom:1px solid var(--hairline);
    display:flex;align-items:center;gap:16px;padding:0 20px;
  }
  .logo-badge{
    width:28px;height:28px;border-radius:8px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;flex-shrink:0;
  }
  .header-title{
    font-size:16px;font-weight:600;letter-spacing:-0.3px;color:var(--ink);
    white-space:nowrap;
  }
  .header-sub{font-size:12px;color:var(--ink-tertiary);white-space:nowrap;}
  .nav-bar{display:flex;gap:4px;margin-left:auto;align-items:center;}
  .nav-item{
    padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink-subtle);
    border-radius:6px;cursor:pointer;transition:all .15s ease;white-space:nowrap;
  }
  .nav-item:hover{color:var(--ink);background:var(--surface-1);}
  .nav-item.active{color:var(--ink);background:var(--surface-2);}
  .user-info{display:flex;align-items:center;gap:8px;margin-left:12px;}
  .status-badge{
    display:flex;align-items:center;gap:6px;
    background:var(--surface-2);color:var(--ink-muted);
    font-size:12px;padding:3px 10px;border-radius:9999px;border:1px solid var(--hairline);
  }
  .status-badge i{font-size:11px;color:var(--primary-hover);}
  .logout-btn{
    padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;
    background:var(--surface-1);color:var(--ink);
    border:1px solid var(--hairline);border-radius:8px;transition:all .15s ease;
    display:flex;align-items:center;gap:6px;
  }
  .logout-btn:hover{border-color:var(--hairline-strong);background:var(--surface-2);}
  .logout-btn i{font-size:11px;color:var(--ink-subtle);}

  /* ============ 主区 3×2 面板 ============ */
  .board{
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
    gap:12px;padding:68px 16px 14px;height:100vh;
  }
  .panel{
    background:var(--surface-1);
    border:1px solid var(--hairline);
    border-radius:12px;
    padding:14px 16px;display:flex;flex-direction:column;overflow:hidden;
    transition:border-color .2s ease;
    position:relative;
  }
  /* Linear 标志性：面板顶部 1px 白色边缘高光 */
  .panel::before{
    content:'';position:absolute;top:0;left:1px;right:1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
  }
  .panel:hover{border-color:var(--hairline-strong);}
  .panel-title{
    font-size:13px;font-weight:500;color:var(--ink-muted);
    display:flex;align-items:center;gap:8px;
    padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--hairline);
    flex-shrink:0;letter-spacing:-0.1px;
  }
  .panel-title i{font-size:13px;color:var(--primary-hover);}
  .panel-title .tag{
    margin-left:auto;font-size:11px;font-weight:400;color:var(--ink-tertiary);
    background:var(--surface-2);border:1px solid var(--hairline);
    padding:1px 8px;border-radius:9999px;
  }
  .chart{flex:1;min-height:0;}
</style>
</head>
<body>

<div class="header">
  <div class="logo-badge"><i class="fas fa-shield-halved"></i></div>
  <div class="header-title">纪检监察大数据可视化平台</div>
  <div class="header-sub">/ 数据呈现</div>
  <div class="nav-bar">
    <div class="nav-item">数据采集</div>
    <div class="nav-item">数据处理</div>
    <div class="nav-item active">数据呈现</div>
    <div class="nav-item">数据评估</div>
  </div>
  <div class="user-info">
    <div class="status-badge"><i class="fas fa-circle-user"></i>访客</div>
    <button class="logout-btn"><i class="fas fa-arrow-right-from-bracket"></i>登出</button>
  </div>
</div>

<div class="board">
  <div class="panel"><div class="panel-title"><i class="fas fa-chart-column"></i>案件查处呈现统计<span class="tag">2026</span></div><div class="chart" id="c1"></div></div>
  <div class="panel"><div class="panel-title"><i class="fas fa-chart-pie"></i>违规事项分布呈现</div><div class="chart" id="c2"></div></div>
  <div class="panel"><div class="panel-title"><i class="fas fa-city"></i>地区案件排名 TOP10</div><div class="chart" id="c3"></div></div>
  <div class="panel"><div class="panel-title"><i class="fas fa-tags"></i>热点关键词分析</div><div class="chart" id="c4"></div></div>
  <div class="panel"><div class="panel-title"><i class="fas fa-sitemap"></i>数据来源构成分析</div><div class="chart" id="c5"></div></div>
  <div class="panel"><div class="panel-title"><i class="fas fa-radar-chart"></i>风险维度综合雷达</div><div class="chart" id="c6"></div></div>
</div>

<script>
/* Linear 图表主题：单一薰衣草主色 + 灰阶 */
var T = {
  text:'#8a8f98', line:'#23252a', split:'#1a1b1e',
  palette:['#5e6ad2','#828fff','#4c9aff','#9ba7ff','#7a7fad','#5b8def','#3d4fb0','#6b8afd']
};
var base = { textStyle:{color:T.text,fontSize:11,fontFamily:'Inter,Microsoft YaHei,sans-serif'}, color:T.palette };
function mk(id,opt){ var c=echarts.init(document.getElementById(id)); c.setOption(Object.assign({},base,opt)); window.addEventListener('resize',function(){c.resize();}); }
var axisCommon = {
  axisLine:{lineStyle:{color:T.line}}, axisTick:{show:false},
  axisLabel:{color:T.text,fontSize:10}, splitLine:{lineStyle:{color:T.split}}
};

mk('c1',{
  grid:{left:36,right:12,top:24,bottom:24},
  tooltip:{trigger:'axis'},
  xAxis:Object.assign({type:'category',data:['1月','2月','3月','4月','5月','6月','7月','8月'],boundaryGap:true},axisCommon),
  yAxis:Object.assign({type:'value'},axisCommon),
  series:[{type:'bar',data:[42,38,55,47,63,58,71,66],barWidth:'46%',
    itemStyle:{color:'#5e6ad2',borderRadius:[3,3,0,0]},
    emphasis:{itemStyle:{color:'#828fff'}}}]
});

mk('c2',{
  tooltip:{trigger:'item'},
  legend:{bottom:0,textStyle:{color:T.text,fontSize:10},itemWidth:10,itemHeight:10,icon:'circle'},
  series:[{type:'pie',radius:['42%','68%'],center:['50%','44%'],
    label:{color:T.text,fontSize:10},
    labelLine:{lineStyle:{color:T.line}},
    itemStyle:{borderColor:'#0f1011',borderWidth:2},
    data:[
      {value:34,name:'违规收送礼金'},{value:22,name:'公款吃喝'},
      {value:18,name:'违规使用公车'},{value:14,name:'违规发放津补贴'},
      {value:8,name:'违规采购'},{value:4,name:'其他'}]}]
});

mk('c3',{
  grid:{left:44,right:30,top:8,bottom:24},
  tooltip:{trigger:'axis'},
  xAxis:Object.assign({type:'value'},axisCommon),
  yAxis:Object.assign({type:'category',inverse:true,
    data:['西安','咸阳','宝鸡','渭南','榆林','延安','汉中','安康','商洛','铜川']},axisCommon),
  series:[{type:'bar',data:[96,78,65,58,52,47,40,33,28,22],barWidth:'55%',
    showBackground:true,backgroundStyle:{color:'#141516'},
    itemStyle:{color:'#5e6ad2',borderRadius:[0,3,3,0]},
    label:{show:true,position:'right',color:'#d0d6e0',fontSize:10}}]
});

mk('c4',{
  series:[{type:'wordCloud',shape:'circle',width:'96%',height:'92%',
    sizeRange:[12,34],rotationRange:[0,0],gridSize:6,
    textStyle:{fontFamily:'Microsoft YaHei',
      color:function(){ return T.palette[Math.floor(Math.random()*T.palette.length)]; }},
    emphasis:{textStyle:{color:'#f7f8f8'}},
    data:[
      {name:'中央八项规定',value:100},{name:'四风问题',value:86},{name:'违规收受礼金',value:72},
      {name:'公款吃喝',value:64},{name:'形式主义',value:55},{name:'官僚主义',value:48},
      {name:'通报曝光',value:42},{name:'警示教育',value:36},{name:'酒驾醉驾',value:30},
      {name:'廉洁纪律',value:26},{name:'群众身边腐败',value:22},{name:'一案双查',value:18}]}]
});

mk('c5',{
  tooltip:{trigger:'item'},
  legend:{bottom:0,textStyle:{color:T.text,fontSize:10},itemWidth:10,itemHeight:10,icon:'circle'},
  series:[{type:'pie',radius:['30%','66%'],center:['50%','44%'],roseType:'radius',
    label:{color:T.text,fontSize:10},
    itemStyle:{borderColor:'#0f1011',borderWidth:2,borderRadius:4},
    data:[
      {value:40,name:'秦风网'},{value:24,name:'省纪委网站'},
      {value:16,name:'市纪委网站'},{value:12,name:'人民网'},
      {value:8,name:'其他来源'}]}]
});

mk('c6',{
  tooltip:{},
  radar:{
    indicator:[
      {name:'查处力度',max:100},{name:'覆盖广度',max:100},{name:'时效性',max:100},
      {name:'数据准确性',max:100},{name:'线索完整性',max:100}],
    radius:'62%',center:['50%','52%'],
    axisName:{color:'#8a8f98',fontSize:10},
    splitLine:{lineStyle:{color:'#23252a'}},
    splitArea:{areaStyle:{color:['rgba(255,255,255,0.01)','rgba(255,255,255,0.02)']}},
    axisLine:{lineStyle:{color:'#23252a'}}
  },
  series:[{type:'radar',
    data:[
      {value:[86,74,90,82,68],name:'本季度',
       lineStyle:{color:'#5e6ad2',width:2},itemStyle:{color:'#5e6ad2'},
       areaStyle:{color:'rgba(94,106,210,0.25)'}},
      {value:[70,66,78,74,60],name:'上季度',
       lineStyle:{color:'#7a7fad',width:1,type:'dashed'},itemStyle:{color:'#7a7fad'},
       areaStyle:{color:'rgba(122,127,173,0.08)'}}],
    label:{show:false}}],
  legend:{bottom:0,textStyle:{color:T.text,fontSize:10},itemWidth:12,itemHeight:8}
});
</script>
</body>
</html>
