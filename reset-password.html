<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - 纪检监察大数据可视化平台</title>

    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background:
                repeating-linear-gradient(0deg, rgba(0, 210, 255, 0.015) 0px, transparent 1px, transparent 40px, rgba(0, 210, 255, 0.015) 41px),
                repeating-linear-gradient(90deg, rgba(0, 210, 255, 0.015) 0px, transparent 1px, transparent 40px, rgba(0, 210, 255, 0.015) 41px),
                linear-gradient(135deg, rgba(11, 15, 42, 0.3) 0%, rgba(26, 31, 58, 0.4) 100%),
                url('https://www.xawl.edu.cn/guanzhong9.jpg');
            background-attachment: fixed;
            background-size: 40px 40px, 40px 40px, 100% 100%, cover;
            background-position: 0 0, 0 0, 0 0, center center;
            background-repeat: repeat, repeat, no-repeat, no-repeat;
            color: #00D2FF;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(153, 51, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 210, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 50% 20%, rgba(0, 210, 255, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(2px 2px at 20% 30%, rgba(0, 210, 255, 0.8), transparent),
                radial-gradient(2px 2px at 60% 70%, rgba(153, 51, 255, 0.8), transparent),
                radial-gradient(1px 1px at 50% 50%, rgba(0, 210, 255, 0.6), transparent),
                radial-gradient(1px 1px at 80% 10%, rgba(153, 51, 255, 0.6), transparent),
                radial-gradient(2px 2px at 90% 60%, rgba(0, 210, 255, 0.7), transparent),
                radial-gradient(1px 1px at 30% 80%, rgba(153, 51, 255, 0.5), transparent);
            background-size: 200% 200%;
            background-position: 0% 0%;
            pointer-events: none;
            z-index: 0;
            animation: particleFloat 20s linear infinite;
        }

        @keyframes bgPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        @keyframes particleFloat {
            0% {
                background-position: 0% 0%;
            }

            100% {
                background-position: 100% 100%;
            }
        }

        .reset-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 480px;
            padding: 60px 50px;
            background: linear-gradient(135deg, rgba(11, 15, 42, 0.95) 0%, rgba(26, 31, 58, 0.92) 100%);
            border: 2px solid rgba(0, 210, 255, 0.5);
            border-radius: 20px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                0 0 60px rgba(0, 210, 255, 0.3),
                inset 0 0 40px rgba(0, 210, 255, 0.05);
            backdrop-filter: blur(20px);
        }

        .reset-container::before,
        .reset-container::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 3px solid #00D2FF;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.8);
            animation: cornerPulse 2s ease-in-out infinite;
        }

        .reset-container::before {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
        }

        .reset-container::after {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
        }

        @keyframes cornerPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .reset-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .reset-logo img {
            height: 60px;
            width: auto;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.6));
            transition: all 0.3s ease;
        }

        .reset-logo img:hover {
            filter: drop-shadow(0 0 25px rgba(0, 210, 255, 0.9));
            transform: scale(1.05);
        }

        .reset-title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(90deg, #00D2FF 0%, #9933FF 50%, #00D2FF 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            letter-spacing: 2px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.5));
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% center;
            }

            50% {
                background-position: 100% center;
            }
        }

        .reset-subtitle {
            text-align: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .reset-form {
            position: relative;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #00D2FF;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 210, 255, 0.05);
            border: 2px solid rgba(0, 210, 255, 0.3);
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #00D2FF;
            background: rgba(0, 210, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .password-strength {
            margin-top: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
        }

        .password-strength.weak {
            color: #FF6B6B;
        }

        .password-strength.medium {
            color: #FFD93D;
        }

        .password-strength.strong {
            color: #51CF66;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00D2FF 0%, #9933FF 100%);
            border: none;
            border-radius: 8px;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4);
            margin-bottom: 20px;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.6);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-to-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-to-login a {
            color: #00D2FF;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-to-login a:hover {
            color: #9933FF;
            text-shadow: 0 0 10px rgba(153, 51, 255, 0.8);
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #FF6B6B;
        }

        .message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid rgba(0, 255, 0, 0.3);
            color: #51CF66;
        }

        .message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .reset-container {
                padding: 40px 30px;
                max-width: 90%;
            }

            .reset-title {
                font-size: 22px;
            }

            .reset-logo img {
                height: 50px;
            }
        }
    </style>
</head>

<body>
    <!-- 重置密码容器 -->
    <div class="reset-container">
        <!-- Logo 区域 -->
        <div class="reset-logo">
            <img src="https://www.xawl.edu.cn/image/logo.png" alt="西安文理学院">
        </div>

        <!-- 标题区域 -->
        <div class="reset-title">
            重置密码
        </div>

        <!-- 副标题 -->
        <div class="reset-subtitle">
            请输入您的新密码
        </div>

        <!-- 重置密码表单 -->
        <form class="reset-form" id="resetForm">
            <!-- 新密码输入 -->
            <div class="form-group">
                <label for="newPassword">
                    <i class="fas fa-lock"></i> 新密码
                </label>
                <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="请输入新密码（至少6位）"
                    required autocomplete="new-password">
                <div class="password-strength" id="passwordStrength"></div>
            </div>

            <!-- 确认密码输入 -->
            <div class="form-group">
                <label for="confirmPassword">
                    <i class="fas fa-lock"></i> 确认密码
                </label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                    placeholder="请再次输入新密码" required autocomplete="new-password">
            </div>

            <!-- 提交按钮 -->
            <button type="submit" class="submit-button" id="submitButton">
                <i class="fas fa-check"></i> 重置密码
            </button>

            <!-- 返回登录 -->
            <div class="back-to-login">
                <a href="login.html">
                    <i class="fas fa-arrow-left"></i> 返回登录
                </a>
            </div>

            <!-- 消息提示 -->
            <div class="message" id="message"></div>
        </form>
    </div>

    <script>
        // 从 URL 获取参数
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 获取 CSRF Token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // 显示消息
        function showMessage(text, type) {
            const messageElement = document.getElementById('message');
            messageElement.textContent = text;
            messageElement.className = `message ${type} show`;

            // 5秒后自动隐藏
            setTimeout(() => {
                messageElement.classList.remove('show');
            }, 5000);
        }

        // 检查密码强度
        function checkPasswordStrength(password) {
            const strengthElement = document.getElementById('passwordStrength');

            if (password.length === 0) {
                strengthElement.textContent = '';
                strengthElement.className = 'password-strength';
                return;
            }

            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[^a-zA-Z0-9]/.test(password)) strength++;

            if (strength <= 2) {
                strengthElement.textContent = '密码强度：弱';
                strengthElement.className = 'password-strength weak';
            } else if (strength <= 3) {
                strengthElement.textContent = '密码强度：中';
                strengthElement.className = 'password-strength medium';
            } else {
                strengthElement.textContent = '密码强度：强';
                strengthElement.className = 'password-strength strong';
            }
        }

        // 监听密码输入，实时显示强度
        document.getElementById('newPassword').addEventListener('input', (e) => {
            checkPasswordStrength(e.target.value);
        });

        // 处理重置密码表单提交
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const uid = getUrlParameter('uid');
            const token = getUrlParameter('token');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitButton = document.getElementById('submitButton');

            // 验证 URL 参数
            if (!uid || !token) {
                showMessage('无效的重置链接，请重新申请密码重置', 'error');
                return;
            }

            // 验证输入
            if (!newPassword || !confirmPassword) {
                showMessage('密码不能为空', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('密码长度至少6位', 'error');
                return;
            }

            // 禁用提交按钮，防止重复提交
            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 处理中...';

            try {
                // 调用重置密码 API
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        uid: uid,
                        token: token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();

                if (response.ok && data.code === 0) {
                    // 重置成功
                    showMessage(data.message || '密码重置成功，3秒后跳转到登录页面', 'success');

                    // 3秒后跳转到登录页面
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 3000);
                } else {
                    // 重置失败
                    showMessage(data.message || '重置失败，请重试', 'error');
                    submitButton.disabled = false;
                    submitButton.innerHTML = '<i class="fas fa-check"></i> 重置密码';
                }
            } catch (error) {
                console.error('重置密码错误:', error);
                showMessage('网络错误，请检查连接后重试', 'error');
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fas fa-check"></i> 重置密码';
            }
        });

        // 页面加载时检查 URL 参数
        window.addEventListener('DOMContentLoaded', () => {
            const uid = getUrlParameter('uid');
            const token = getUrlParameter('token');

            if (!uid || !token) {
                showMessage('无效的重置链接，请重新申请密码重置', 'error');
            }
        });
    </script>
</body>

</html>
